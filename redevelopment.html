<!doctype html><html lang="ko"><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>재개발 비교평가표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 위에서 아래로 "비교 요약 → 물건 선택 → 입력·체크리스트". 넓은 화면에서는 입력 옆에 계산 결과가 따라온다. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e8edeb; --line:#d3dcd9;
  --fg:#17262a; --muted:#5c6d70; --accent:#0d6a70; --accent-fg:#ffffff; --accent-soft:#d9ecec;
  --good:#1f7a4d; --good-soft:#dcf0e4; --warn:#9a6400; --warn-soft:#f7ead0; --bad:#b3372f; --bad-soft:#f8dedb;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10191b; --surface:#18252a; --sunk:#0c1416; --line:#2c3d42;
  --fg:#e6eeee; --muted:#93a6a9; --accent:#56c2c4; --accent-fg:#06282a; --accent-soft:#173c40;
  --good:#63cc93; --good-soft:#163a28; --warn:#e3b256; --warn-soft:#3d2f10; --bad:#f08a80; --bad-soft:#45201d;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10191b; --surface:#18252a; --sunk:#0c1416; --line:#2c3d42;
  --fg:#e6eeee; --muted:#93a6a9; --accent:#56c2c4; --accent-fg:#06282a; --accent-soft:#173c40;
  --good:#63cc93; --good-soft:#163a28; --warn:#e3b256; --warn-soft:#3d2f10; --bad:#f08a80; --bad-soft:#45201d;
  color-scheme:dark }

*{box-sizing:border-box}
.host body{background:transparent}
.host .wrap{padding-block:4px 24px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.lede{color:var(--muted);max-width:62ch;margin-top:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.status{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.spread{justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 10px;width:100%;min-width:0}
.inp.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.unit{display:flex;align-items:center;gap:6px}
.unit span{font-size:13px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.inline-inp{width:76px}

/* 비교 */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-bar{width:22px;height:8px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent)}
.lg-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.lg-x{width:9px;height:9px;transform:rotate(45deg);border:2px solid var(--bad);background:var(--surface)}
.chart{display:flex;flex-direction:column;gap:12px}
.crow{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 14px;align-items:center}
.crow .nm{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.track{position:relative;height:30px;background:var(--sunk);border-radius:6px}
.track .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--fg);opacity:.55}
.track .rng{position:absolute;top:10px;height:10px;border-radius:5px;background:var(--accent-soft);border:1px solid var(--accent)}
.track .dot{position:absolute;top:9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent)}
.track .sx{position:absolute;top:10px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);border:2px solid var(--bad);background:var(--surface)}
.axis{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:14px;font-size:12px;color:var(--muted)}
.axis .ticks{position:relative;height:18px}
.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis .ticks span:first-child{transform:none}
.axis .ticks span:last-child{transform:translateX(-100%)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
th:first-child,td:first-child{text-align:left;color:var(--muted);font-weight:500;position:sticky;left:0;background:var(--surface)}
thead th{font-weight:600;white-space:normal;min-width:130px;overflow-wrap:anywhere}
tr.grp td{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--sunk);border-bottom:0;padding-block:5px}
tr.grp td:first-child{background:var(--sunk)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ex{background:var(--sunk);color:var(--muted)}
.pill.site{background:var(--accent-soft);color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted)}

/* 탭 */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:left}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}

/* 편집 */
.editor{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:940px){
  .editor{grid-template-columns:minmax(0,1fr) 350px}
  .editor>.panel{grid-column:1}
  .editor>.result{grid-column:2;grid-row:1/span 8;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.kv .total{font-weight:700;color:var(--fg)}
.result table th,.result table td{padding:6px 8px;font-size:13px}
.result thead th{min-width:0}
.formula{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:7px;padding:8px 10px}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer}
.stage[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-size:14px;font-weight:500}
.item .h{font-size:12px;color:var(--muted)}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--bg);padding:6px 12px;font-size:13px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].g{background:var(--good-soft);color:var(--good);font-weight:600}
.seg button[aria-pressed="true"].m{background:var(--warn-soft);color:var(--warn);font-weight:600}
.seg button[aria-pressed="true"].b{background:var(--bad-soft);color:var(--bad);font-weight:600}
.cat-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin-top:8px}
.switch{display:inline-flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
textarea.inp{min-height:90px;resize:vertical}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <h1>재개발 비교평가표</h1>
      <p class="lede">물건마다 다른 조건을 완공 후 신축 한 채의 총 취득원가로 환산해 나란히 비교합니다. 금액 단위는 모두 억원입니다.</p>
    </div>
    <div class="status" id="status" role="status">불러오는 중…</div>
  </header>

  <section class="panel" aria-labelledby="cmp-h">
    <div class="row spread">
      <h2 id="cmp-h">비교 요약</h2>
      <div class="row">
        <div class="field"><label for="sort" class="small muted">정렬</label>
          <select id="sort" class="inp">
            <option value="low">저점 시세 기준 마진율</option>
            <option value="now">현재 시세 기준 마진율</option>
            <option value="cagr">연환산 마진율</option>
            <option value="stress">스트레스 마진</option>
            <option value="score">체크리스트 점수</option>
          </select></div>
      </div>
    </div>
    <div class="row small">
      <span class="muted">스트레스 가정</span>
      <label for="st-sp">조합원 분양가 인상</label>
      <span class="unit"><input id="st-sp" class="inp n inline-inp" type="number" inputmode="decimal" step="1"><span>%</span></span>
      <label for="st-delay">사업 지연</label>
      <span class="unit"><input id="st-delay" class="inp n inline-inp" type="number" inputmode="decimal" step="0.5"><span>년</span></span>
      <span class="muted">+ 비교 단지 저점 시세 적용</span>
    </div>
    <div id="compare"></div>
    <p class="small muted">모든 수치는 입력값을 그대로 계산한 결과이며 매수 추천이 아닙니다. 결격 점검에 '문제'가 하나라도 있거나 확인율이 낮으면 마진이 커 보여도 믿을 수 없는 숫자입니다.</p>
  </section>

  <section aria-labelledby="list-h" style="display:flex;flex-direction:column;gap:12px">
    <div class="row spread">
      <h2 id="list-h">물건</h2>
      <button class="btn primary" id="add" type="button">물건 추가</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </section>

  <div class="editor" id="editor"></div>
</div>

<script>

const S={cands:{},sel:null,sort:"low",siteOnly:false,stress:{sp:15,delay:2},mode:"loading"};

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const N=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const has=v=>v!==""&&v!=null&&isFinite(parseFloat(v));
const eok=v=>v==null||!isFinite(v)?"—":v.toFixed(2)+"억";
const sgn=v=>v==null||!isFinite(v)?"—":(v>0?"+":"")+v.toFixed(2)+"억";
const pct=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1)+"%";
const cls=v=>v==null||!isFinite(v)?"":v>=0?"pos":"neg";

function calc(c,st){
  const n=c.n||{}, r={};
  r.right=N(n.appraisal)*(has(n.ratio)?N(n.ratio):100)/100;
  r.premium=N(n.price)-N(n.appraisal);
  r.extra=N(n.memberPrice)-r.right;
  const yrs=N(n.years);
  r.fin=N(n.loan)*N(n.rate)/100*yrs;
  r.total=N(n.price)+r.extra+N(n.cost)+r.fin+N(n.living);
  r.cash=N(n.price)+N(n.cost)-N(n.deposit)-N(n.loan);
  r.ready=has(n.price)&&has(n.appraisal)&&has(n.memberPrice);
  const k=1+N(n.adj)/100;
  r.sc={};
  for(const [key,f] of [["low","compLow"],["now","compNow"],["high","compHigh"]]){
    if(r.ready&&has(n[f])){const v=N(n[f])*k;r.sc[key]={value:v,margin:v-r.total,rate:v>0?(v-r.total)/v:null}}
    else r.sc[key]=null;
  }
  r.cagr=r.sc.now&&yrs>0&&r.total>0?Math.pow(r.sc.now.value/r.total,1/yrs)-1:null;
  // 스트레스: 조합원 분양가 인상 + 지연 + 저점 시세
  if(r.sc.low){
    const y2=yrs+N(st.delay);
    const extra2=N(n.memberPrice)*(1+N(st.sp)/100)-r.right;
    const fin2=N(n.loan)*N(n.rate)/100*y2;
    const liv2=yrs>0?N(n.living)*y2/yrs:N(n.living);
    r.stressTotal=N(n.price)+extra2+N(n.cost)+fin2+liv2;
    r.stress=r.sc.low.value-r.stressTotal;
  } else r.stress=null;
  const tu=N(n.totalUnits);
  r.general=tu>0&&has(n.members)?(tu-N(n.rental)-N(n.members))/tu:null;
  // 체크리스트
  let wsum=0,acc=0,answered=0,count=0; r.cat={};
  for(const cat of CATS){
    let a=0,s=0;
    for(const it of cat.items){count++;const v=(c.chk||{})[it.id];if(v===0||v===1||v===2){a++;s+=v/2}}
    answered+=a; r.cat[cat.id]=a?s/a:null;
    if(a){wsum+=cat.w;acc+=cat.w*s/a}
  }
  r.score=wsum?acc/wsum*100:null;
  let kOk=0,kBad=0;
  for(const it of KILL){const v=(c.kill||{})[it.id];if(v==="ok")kOk++;else if(v==="bad")kBad++}
  r.kBad=kBad; r.kOpen=KILL.length-kOk-kBad;
  r.done=(answered+kOk+kBad)/(count+KILL.length);
  return r;
}

function killPill(r){
  if(r.kBad) return `<span class="pill bad">문제 ${r.kBad}건</span>`;
  if(r.kOpen) return `<span class="pill warn">미확인 ${r.kOpen}건</span>`;
  return `<span class="pill good">모두 통과</span>`;
}
function ordered(){
  const ids=Object.keys(S.cands).sort((a,b)=>(S.cands[a].created||0)-(S.cands[b].created||0));
  return ids;
}

function renderCompare(){
  const el=$("compare"), ids=ordered();
  if(S.mode==="loading"&&!ids.length){el.innerHTML=`<div class="empty">저장된 물건을 불러오는 중입니다.</div>`;return}
  if(!ids.length){el.innerHTML=`<div class="empty">아직 등록된 물건이 없습니다. 아래 '물건 추가'로 첫 물건을 넣으면 여기에 총 취득원가와 안전마진이 나란히 표시됩니다.</div>`;return}
  const rows=ids.map(id=>({id,c:S.cands[id],r:calc(S.cands[id],S.stress)}));
  const key=x=>{const r=x.r;const v=S.sort==="low"?r.sc.low?.rate:S.sort==="now"?r.sc.now?.rate:S.sort==="cagr"?r.cagr:S.sort==="stress"?r.stress:r.score;return v==null||!isFinite(v)?-Infinity:v};
  rows.sort((a,b)=>key(b)-key(a));
  // 차트 범위
  const vals=[0];
  rows.forEach(x=>{["low","now","high"].forEach(k=>x.r.sc[k]&&vals.push(x.r.sc[k].margin));x.r.stress!=null&&vals.push(x.r.stress)});
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mx-mn<1){mx+=.5;mn-=.5}
  const pad=(mx-mn)*.04; mn-=pad; mx+=pad;
  const pos=v=>((v-mn)/(mx-mn)*100).toFixed(2)+"%";
  const anyChart=rows.some(x=>x.r.sc.low||x.r.sc.now||x.r.sc.high);
  let h="";
  if(anyChart){
    h+=`<div class="legend" style="margin-bottom:10px"><span><i class="lg-bar"></i>안전마진 범위 (저점~전고점 시세)</span><span><i class="lg-dot"></i>현재 시세 기준</span><span><i class="lg-x"></i>스트레스</span></div><div class="chart">`;
    for(const x of rows){
      const m=["low","now","high"].map(k=>x.r.sc[k]?.margin).filter(v=>v!=null);
      let marks=`<span class="zero" style="left:${pos(0)}"></span>`;
      if(m.length){const a=Math.min(...m),b=Math.max(...m);marks+=`<span class="rng" style="left:${pos(a)};width:calc(${pos(b)} - ${pos(a)})"></span>`}
      if(x.r.sc.now) marks+=`<span class="dot" style="left:${pos(x.r.sc.now.margin)}"></span>`;
      if(x.r.stress!=null) marks+=`<span class="sx" style="left:${pos(x.r.stress)}"></span>`;
      h+=`<div class="crow"><div class="nm">${esc(x.c.name||"이름 없는 물건")}</div><div class="track" role="img" aria-label="안전마진 저점 ${sgn(x.r.sc.low?.margin)}, 현재 ${sgn(x.r.sc.now?.margin)}, 전고점 ${sgn(x.r.sc.high?.margin)}, 스트레스 ${sgn(x.r.stress)}">${marks}</div></div>`;
    }
    h+=`<div class="axis"><span></span><div class="ticks num"><span style="left:0">${sgn(mn)}</span><span style="left:${pos(0)}">0</span><span style="left:100%">${sgn(mx)}</span></div></div></div>`;
  }
  const cell=(v,f,c)=>`<td class="num ${c?cls(v):""}">${f(v)}</td>`;
  const sc=(k)=>rows.map(x=>{const s=x.r.sc[k];return `<td class="num ${cls(s?.margin)}">${sgn(s?.margin)}<br><span class="small">${pct(s?.rate)}</span></td>`}).join("");
  h+=`<div class="scroll" style="margin-top:16px"><table><thead><tr><th scope="col">항목</th>${rows.map(x=>`<th scope="col">${esc(x.c.name||"이름 없는 물건")}${x.c.example?' <span class="pill ex">예시</span>':""}</th>`).join("")}</tr></thead><tbody>
  <tr><td>사업 단계</td>${rows.map(x=>`<td>${esc(STAGES[x.c.stage]??"—")}</td>`).join("")}</tr>
  <tr class="grp"><td colspan="${rows.length+1}">원가</td></tr>
  <tr><td>총 취득원가</td>${rows.map(x=>cell(x.r.ready?x.r.total:null,eok)).join("")}</tr>
  <tr><td>초기 실투자금</td>${rows.map(x=>cell(has(x.c.n?.price)?x.r.cash:null,eok)).join("")}</tr>
  <tr class="grp"><td colspan="${rows.length+1}">안전마진 (금액 · 마진율)</td></tr>
  <tr><td>저점 시세 기준</td>${sc("low")}</tr>
  <tr><td>현재 시세 기준</td>${sc("now")}</tr>
  <tr><td>전고점 시세 기준</td>${sc("high")}</tr>
  <tr><td>스트레스</td>${rows.map(x=>cell(x.r.stress,sgn,1)).join("")}</tr>
  <tr><td>연환산 마진율 (현재 시세)</td>${rows.map(x=>cell(x.r.cagr,pct,1)).join("")}</tr>
  <tr class="grp"><td colspan="${rows.length+1}">검증</td></tr>
  <tr><td>일반분양 비율</td>${rows.map(x=>cell(x.r.general,pct)).join("")}</tr>
  <tr><td>체크리스트 점수</td>${rows.map(x=>`<td class="num">${x.r.score==null?"—":x.r.score.toFixed(0)+"점"}</td>`).join("")}</tr>
  <tr><td>확인율</td>${rows.map(x=>cell(x.r.done,pct)).join("")}</tr>
  <tr><td>결격 점검</td>${rows.map(x=>`<td>${killPill(x.r)}</td>`).join("")}</tr>
  </tbody></table></div>`;
  el.innerHTML=h;
}

function numField(def,c){

  return `<div class="field"><label for="f-${k}">${label}</label><div class="unit"><input class="inp n" id="f-${k}" data-k="${k}" type="number" inputmode="decimal" step="any" value="${esc(c.n?.[k]??"")}" ${canWrite?"":"disabled"}><span>${unit}</span></div><span class="hint">${hint}</span></div>`;
}
function seg(kind,id,v){
  const opts=kind==="kill"?[["ok","통과","g"],["bad","문제","b"]]:[[2,"좋음","g"],[1,"보통","m"],[0,"나쁨","b"]];
  return `<div class="seg" role="group">${opts.map(o=>`<button type="button" class="${o[2]}" data-seg="${kind}" data-id="${id}" data-v="${o[0]}" aria-pressed="${String(v)===String(o[0])}" ${canWrite?"":"disabled"}>${o[1]}</button>`).join("")}</div>`;

   <dt>스트레스 마진</dt><dd class="num ${cls(r.stress)}">${sgn(r.stress)}</dd>
   <dt>연환산 마진율</dt><dd class="num ${cls(r.cagr)}">${pct(r.cagr)}</dd>
   <dt>일반분양 비율</dt><dd class="num">${pct(r.general)}</dd>
   <dt>체크리스트 점수</dt><dd class="num">${r.score==null?"—":r.score.toFixed(0)+"점"}</dd>
   <dt>확인율</dt><dd class="num">${pct(r.done)}</dd>
   <dt>결격 점검</dt><dd>${killPill(r)}</dd>
  </dl>
  <p class="small muted">스트레스는 저점 시세에 조합원 분양가 ${N(S.stress.sp)}% 인상과 ${N(S.stress.delay)}년 지연을 함께 적용한 값입니다. 연환산 마진율은 총 취득원가 대비 현재 시세 기준 완공 가치를 입주까지 기간으로 나눈 단순 지표입니다.</p>`;
}

function refresh(){renderCompare();renderTabs();renderResult();editorSig=sig()}
function setStatus(t){$("status").textContent=t}

/* 저장 */
function saveLocal(){try{localStorage.setItem("rdv-cands",JSON.stringify(S.cands))}catch(e){}}
/* 무버 안에 iframe으로 들어가 있을 때는 저장을 부모 페이지(무버)에 맡긴다 → 로그인 계정에 자동 동기화 */
const HOST=window.parent!==window, TO=location.origin==="null"?"*":location.origin;
let hostSynced=false;
function postHost(){ window.parent.postMessage({type:"rdv-save",cands:clone(S.cands),stress:clone(S.stress)},TO) }
function applyHost(d){
  S.mode="host"; hostSynced=!!d.synced;
  const cands=d.cands||{}, seen={};
  Object.keys(cands).forEach(id=>{seen[id]=1; if(!dirty[id]) S.cands[id]=clone(cands[id])});
  Object.keys(S.cands).forEach(id=>{ if(!seen[id]&&!dirty[id]) delete S.cands[id] });
  if(d.stress){
    for(const [id,k] of [["st-sp","sp"],["st-delay","delay"]]){
      if(document.activeElement!==$(id)){ S.stress[k]=d.stress[k]; $(id).value=d.stress[k] }
    }
  }
  if(!S.cands[S.sel]) S.sel=ordered()[0]||null;
  renderCompare(); renderTabs();
  if(sig()!==editorSig && !$("editor").contains(document.activeElement)) renderEditor();
  else renderResult();
  if(!Object.keys(dirty).length) setStatus(hostSynced?"저장됨 · 로그인 계정에 동기화돼요 (어느 기기에서나 같은 내용)":"저장됨 · 이 브라우저에만 보관 (로그인하면 기기 간 동기화)");
}
function touch(id,now){
  dirty[id]=true; ver[id]=(ver[id]||0)+1; clearTimeout(timers[id]);
  setStatus("저장 중…");
  timers[id]=setTimeout(()=>flush(id),now?0:700);
}
async function flush(id){
  if(saving[id]){again[id]=true;return}
  saving[id]=true; const v=ver[id], c=S.cands[id];
  try{
    if(S.mode==="db"){ if(c) await col.doc(id).set(clone(c)) } else if(S.mode==="host") postHost(); else saveLocal();
    if(ver[id]===v) delete dirty[id];
    setStatus(S.mode==="db"?"저장됨 · 어느 기기에서 열어도 같은 내용":S.mode==="host"&&hostSynced?"저장됨 · 로그인 계정에 동기화돼요 (어느 기기에서나 같은 내용)":"저장됨 · 이 브라우저에만 보관");
  }catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;setStatus("읽기 전용으로 열려 있어 저장되지 않습니다");renderEditor()}
    else if(e&&e.code==="quota_exceeded") setStatus("저장 공간이 가득 찼습니다. 쓰지 않는 물건을 삭제해 주세요");
    else setStatus("저장하지 못했습니다. 잠시 뒤 다시 수정하면 재시도합니다");
  }
  saving[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}

/* 이벤트 */
$("editor").addEventListener("input",e=>{
  const t=e.target, c=S.cands[S.sel]; if(!c) return;
  if(t.id==="site-only"){S.siteOnly=t.checked;renderEditor();return}
  if(t.dataset.k){c.n=c.n||{};c.n[t.dataset.k]=t.value}
  else if(t.dataset.t){c[t.dataset.t]=t.value}
  else return;
  refresh(); touch(S.sel);
});
$("editor").addEventListener("click",e=>{
  const b=e.target.closest("button"), c=S.cands[S.sel]; if(!b||!c) return;
  if(b.dataset.stage!=null){c.stage=+b.dataset.stage;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));refresh();touch(S.sel)}
  else if(b.dataset.seg){
    const key=b.dataset.seg==="kill"?"kill":"chk", id=b.dataset.id, raw=b.dataset.v, val=key==="kill"?raw:+raw;
    c[key]=c[key]||{};
    if(String(c[key][id])===raw) delete c[key][id]; else c[key][id]=val;
    b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(c[key][id])===x.dataset.v));
    refresh();touch(S.sel);
  }
  else if(b.id==="del"){$("del-wrap").innerHTML=`<span class="small">삭제하면 되돌릴 수 없습니다.</span> <button type="button" class="btn danger" id="del-yes">삭제</button> <button type="button" class="btn" id="del-no">취소</button>`}
  else if(b.id==="del-no"){$("del-wrap").innerHTML=`<button type="button" class="btn danger" id="del">이 물건 삭제</button>`}
  else if(b.id==="del-yes"){removeCand(S.sel)}
});
async function removeCand(id){
  delete S.cands[id]; delete dirty[id]; clearTimeout(timers[id]);
  S.sel=ordered()[0]||null; renderAll();
  try{ if(S.mode==="db") await col.doc(id).delete(); else if(S.mode==="host") postHost(); else saveLocal(); setStatus("삭제됨") }
  catch(e){ setStatus("삭제하지 못했습니다") }
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;S.sel=b.dataset.id;renderTabs();renderEditor()});
$("add").addEventListener("click",()=>{
  if(!canWrite) return;
  const id=S.mode==="db"?col.doc().id:"c"+Date.now().toString(36);
  S.cands[id]={name:"",type:TYPES[0],stage:null,n:{ratio:"100"},kill:{},chk:{},memo:"",compName:"",created:Date.now()};
  S.sel=id; renderAll(); touch(id,true);
  const f=$("f-name"); f&&f.focus();
});
$("sort").addEventListener("change",e=>{S.sort=e.target.value;renderCompare()});
for(const [id,k] of [["st-sp","sp"],["st-delay","delay"]]){
  $(id).addEventListener("input",e=>{S.stress[k]=e.target.value;if(S.mode==="host")postHost();else{try{localStorage.setItem("rdv-stress",JSON.stringify(S.stress))}catch(_){}}renderCompare();renderResult()});
}
function renderAll(){renderCompare();renderTabs();renderEditor()}

/* 시작 */
async function start(){
  if(HOST){
    document.documentElement.classList.add("host");
    renderAll();
    window.addEventListener("message",e=>{
      if(e.source!==window.parent) return;
      if(e.origin!==location.origin && location.origin!=="null") return;
      if(e.data&&e.data.type==="rdv-init") applyHost(e.data);
    });
    if(window.ResizeObserver){
      const wrap=document.querySelector(".wrap"), sendH=()=>{
        const h=Math.ceil(wrap.getBoundingClientRect().height);
        if(h>50) window.parent.postMessage({type:"rdv-height",h:h+4},TO);
      };
      new ResizeObserver(sendH).observe(wrap); sendH();
    }
    window.parent.postMessage({type:"rdv-ready"},TO);
    return;
  }
  try{const s=JSON.parse(localStorage.getItem("rdv-stress")||"null");if(s)S.stress=s}catch(e){}
  $("st-sp").value=S.stress.sp; $("st-delay").value=S.stress.delay;
  renderAll();
  let db=null;
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null }catch(e){ db=null }
  if(!db){
    S.mode="local";
    try{S.cands=JSON.parse(localStorage.getItem("rdv-cands")||"{}")||{}}catch(e){S.cands={}}
    S.sel=ordered()[0]||null; renderAll();
    setStatus("이 브라우저에만 저장됩니다");
    return;
  }
  col=db.collection("candidates");
  const slow=setTimeout(()=>{ if(S.mode==="loading") setStatus("저장된 데이터에 아직 연결되지 않았습니다. 연결되면 자동으로 표시됩니다") },10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(slow);
    S.mode="db";
    const seen={};
    snap.docs.forEach(d=>{seen[d.id]=1; if(!dirty[d.id]) S.cands[d.id]=clone(d.data())});
    Object.keys(S.cands).forEach(id=>{ if(!seen[id]&&!dirty[id]) delete S.cands[id] });
    if(!S.cands[S.sel]) S.sel=ordered()[0]||null;
    renderCompare(); renderTabs();
    if(sig()!==editorSig && !$("editor").contains(document.activeElement)) renderEditor();
    if(!Object.keys(dirty).length) setStatus(snap.metadata.fromCache?"이전 방문 때 저장된 내용 표시 중":"저장됨 · 어느 기기에서 열어도 같은 내용");
  },err=>{
    clearTimeout(slow);
    if(S.mode==="loading"){S.mode="local";renderAll()}
    setStatus("저장소에 연결할 수 없습니다. 지금 입력하는 내용은 보관되지 않을 수 있습니다");
  });
}
start();
</script>

</body></html>
