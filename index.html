  app.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var t = e.target;
    if(t.getAttribute("data-action")==="todo-new"){
      e.preventDefault();
      addTodo(t.getAttribute("data-date"), t.getAttribute("data-group"));
    } else if(t.getAttribute("data-action")==="extra-routine-new"){
      e.preventDefault();
      addExtraRoutine(t.getAttribute("data-date"));
    }
  });

  function addTodo(dateStr, group){
    var input = app.querySelector('[data-action="todo-new"][data-date="'+dateStr+'"][data-group="'+group+'"]');
    var text = input ? input.value.trim() : "";
    if(!text) return;
    var arr = getTodos(dateStr, group);
    arr.push({id:uid("td"), text:text, done:false});
    setTodos(dateStr, group, arr);
    render();
    var newInput = app.querySelector('[data-action="todo-new"][data-date="'+dateStr+'"][data-group="'+group+'"]');
    if(newInput) newInput.focus();
  }

  function addExtraRoutine(dateStr){
    var input = app.querySelector('[data-action="extra-routine-new"][data-date="'+dateStr+'"]');
    var text = input ? input.value.trim() : "";
    if(!text) return;
    var arr = getExtraRoutines(dateStr);
    arr.push({id:uid("er"), text:text, done:false});
    setExtraRoutines(dateStr, arr);
    render();
  }

  function refreshCounts(){
    var h2 = app.querySelector(".card h2 .count");
    if(h2){
      var prog = goalProgress(state.selectedDate);
      h2.textContent = prog.done + " / " + prog.filled;
    }
    var rateEl = app.querySelector(".month-rate");
    if(rateEl){
      var parts = state.selectedDate.split("-").map(Number);
      var monthGoalStats = computeMonthGoalStats(parts[0], parts[1]-1);
      var monthPct = monthGoalStats.totalFilled ? Math.round(monthGoalStats.totalAchieved/monthGoalStats.totalFilled*100) : 0;
      rateEl.innerHTML = '이번 달 달성률 <strong class="mono">'+monthPct+'%</strong><span class="month-rate-sub mono">('+monthGoalStats.totalAchieved+'/'+monthGoalStats.totalFilled+')</span>';
    }
    var summaryEl = app.querySelector(".month-summary");
    if(summaryEl){
      var ms = computeMonthGoalStats(state.year, state.month);
      var msPct = ms.totalFilled ? Math.round(ms.totalAchieved/ms.totalFilled*100) : 0;
      summaryEl.querySelector(".month-summary-pct").textContent = msPct + "%";
      summaryEl.querySelector(".month-summary-fill").style.width = msPct + "%";
      summaryEl.querySelector(".month-summary-count").textContent = ms.totalAchieved + " / " + ms.totalFilled + " 완료";
    }
  }

  function changeMonth(delta){
    var m = state.month + delta;
    var y = state.year;
    if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
    state.month = m; state.year = y;
    save(); render();
  }

  function shiftDay(delta){
    var p = state.selectedDate.split("-").map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate()+delta);
    state.selectedDate = keyOf(d);
    state.year = d.getFullYear(); state.month = d.getMonth();
    save(); render();
  }

  /* ---------------- 칸 선택 · 지우기 · 시간표 복사/붙여넣기 ---------------- */
  // 선택 상태는 화면 전용이라 저장·동기화하지 않아요. id 형식: g|날짜|카테고리(목표), t|날짜|그룹|id(할일), e|날짜|id(오늘만 루틴), h|날짜|시(시간표)
  var selMode = false, sel = {}, selAnchor = null, selScope = "", dragSel = null, hourClip = null, undoSnap = null;

  function selIsHour(id){ return id.charAt(0) === "h"; }
  function selList(hour){ return Object.keys(sel).filter(function(id){ return selIsHour(id) === hour; }); }
  function hourSelList(){ return SLOTS.filter(function(h){ return sel["h|" + state.selectedDate + "|" + h]; }); }

  function selBeforeRender(){
    var scope = state.view + "|" + (state.view === "day" ? state.selectedDate : state.year + "-" + state.month);
    if(scope !== selScope){ selScope = scope; sel = {}; selAnchor = null; selMode = false; }
  }
  function selAfterRender(){
    app.classList.toggle("sel-on", selMode && (state.view === "month" || state.view === "day"));
    paintSel();
  }

  function selBarHtml(){
    var n = selList(false).length;
    var h = '<div class="sel-bar" data-bar="main">';
    h += '<button type="button" class="icon-btn sel-mode-btn' + (selMode ? ' on' : '') + '" data-action="sel-mode">' + (selMode ? '✔ 선택 모드 끄기' : '☑ 칸 선택 · 지우기') + '</button>';
    if(selMode){
      h += '<span class="sel-count mono" data-role="count">' + n + '칸 선택</span>';
      h += '<button type="button" class="icon-btn danger" data-action="sel-delete" data-role="needmain"' + (n ? '' : ' disabled') + '>선택한 칸 지우기</button>';
      h += '<button type="button" class="icon-btn" data-action="sel-all">전체 선택</button>';
      h += '<button type="button" class="icon-btn" data-action="sel-clear" data-role="needmain"' + (n ? '' : ' disabled') + '>선택 해제</button>';
    }
    if(undoSnap && undoSnap.kind === "main") h += '<button type="button" class="icon-btn" data-action="undo">↶ 되돌리기 (' + escapeHtml(undoSnap.label) + ')</button>';
    if(selMode){
      h += '<div class="sel-hint">' + (state.view === "day" ? '목표·할일·오늘만 루틴 줄을' : '칸을') + ' 클릭하거나 드래그해서 여러 개 고르세요. Shift+클릭은 범위 선택' +
        (state.view === "month" ? ', 카테고리 이름을 누르면 그 주의 한 줄이 통째로 선택돼요' : '') + '. 지우기는 되돌릴 수 있어요.</div>';
    }
    h += '</div>';
    return h;
  }

  function hourBarHtml(){
    var n = selList(true).length;
    var h = '<div class="sel-bar hour-bar" data-bar="hour">';
    h += '<span class="sel-count mono" data-role="hcount">' + n + '칸 선택</span>';
    h += '<select class="hour-apply" data-action="hour-apply" data-role="needhour"' + (n ? '' : ' disabled') + '><option value="">선택한 칸에 활동 한 번에 적용…</option>';
    state.timeCategories.forEach(function(tc){
      if(!tc.activities.length) return;
      h += '<optgroup label="' + escapeHtml(tc.name) + '">';
      tc.activities.forEach(function(act){ h += '<option value="' + act.id + '">' + escapeHtml(act.name) + '</option>'; });
      h += '</optgroup>';
    });
    h += '<option value="__clear">(비우기)</option></select>';
    h += '<button type="button" class="icon-btn" data-action="hour-copy" data-role="needhour"' + (n ? '' : ' disabled') + '>복사</button>';
    h += '<button type="button" class="icon-btn" data-action="hour-paste" data-role="needclip"' + (n && hourClip ? '' : ' disabled') + '>붙여넣기' + (hourClip ? ' (' + hourClip.length + '칸)' : '') + '</button>';
    h += '<button type="button" class="icon-btn danger" data-action="hour-clear" data-role="needhour"' + (n ? '' : ' disabled') + '>지우기</button>';
    h += '<button type="button" class="icon-btn" data-action="hour-sel-all">전체</button>';
    h += '<button type="button" class="icon-btn" data-action="hour-sel-clear" data-role="needhour"' + (n ? '' : ' disabled') + '>해제</button>';
    if(undoSnap && undoSnap.kind === "hour") h += '<button type="button" class="icon-btn" data-action="undo">↶ 되돌리기 (' + escapeHtml(undoSnap.label) + ')</button>';
    h += '<div class="sel-hint">칸을 클릭하면 선택돼요(엑셀처럼). 드래그나 Shift+클릭은 범위, Ctrl+클릭은 하나씩 추가예요. 활동을 바꾸려면 칸을 더블클릭하거나 오른쪽 ▾를 누르세요. 한 칸을 복사해 여러 칸을 고르고 붙여넣으면 전부 같은 활동으로 채워지고, 여러 칸을 복사하면 선택한 첫 칸부터 순서대로 붙여넣어요. (Ctrl+C / Ctrl+V / Delete도 돼요)</div>';
    h += '</div>';
    return h;
  }

  // 클릭·드래그 중에는 다시 그리지 않고 표시만 갱신해요 (입력 포커스·드래그 유지).
  function paintSel(){
    app.querySelectorAll("[data-sel]").forEach(function(el){ el.classList.toggle("selected", !!sel[el.getAttribute("data-sel")]); });
    var nMain = selList(false).length, nHour = selList(true).length;
    app.querySelectorAll('[data-role="count"]').forEach(function(el){ el.textContent = nMain + "칸 선택"; });
    app.querySelectorAll('[data-role="hcount"]').forEach(function(el){ el.textContent = nHour + "칸 선택"; });
    app.querySelectorAll('[data-role="needmain"]').forEach(function(el){ el.disabled = !nMain; });
    app.querySelectorAll('[data-role="needhour"]').forEach(function(el){ el.disabled = !nHour; });
    app.querySelectorAll('[data-role="needclip"]').forEach(function(el){ el.disabled = !nHour || !hourClip; });
  }

  function addRect(aId, bId){
    var a = app.querySelector('[data-sel="' + aId + '"]'), b = app.querySelector('[data-sel="' + bId + '"]');
    if(!a || !b) return;
    var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    var l = Math.min(ra.left, rb.left), r = Math.max(ra.right, rb.right), t = Math.min(ra.top, rb.top), bt = Math.max(ra.bottom, rb.bottom);
    var hour = selIsHour(aId);
    app.querySelectorAll("[data-sel]").forEach(function(el){
      var id = el.getAttribute("data-sel");
      if(selIsHour(id) !== hour) return;
      var rc = el.getBoundingClientRect(), cx = (rc.left + rc.right) / 2, cy = (rc.top + rc.bottom) / 2;
      if(cx >= l && cx <= r && cy >= t && cy <= bt) sel[id] = true;
    });
  }

  function snapDays(dates, label, kind){
    var days = {};
    dates.forEach(function(d){ days[d] = state.days[d] ? JSON.stringify(state.days[d]) : null; });
    undoSnap = {days:days, label:label, kind:kind};
  }
  function undoLast(){
    if(!undoSnap) return;
    Object.keys(undoSnap.days).forEach(function(d){
      if(undoSnap.days[d] === null) delete state.days[d]; else state.days[d] = JSON.parse(undoSnap.days[d]);
    });
    undoSnap = null; save(); render();
  }

  function doSelDelete(){
    var ids = selList(false);
    if(!ids.length) return;
    var dates = {};
    ids.forEach(function(id){ dates[id.split("|")[1]] = 1; });
    snapDays(Object.keys(dates), ids.length + "칸 지움", "main");
    ids.forEach(function(id){
      var p = id.split("|"), day = state.days[p[1]];
      delete sel[id];
      if(!day) return;
      if(p[0] === "g"){
        if(day.goals) day.goals[p[2]] = "";
        if(day.achieved) day.achieved[p[2]] = false;
      } else if(p[0] === "t"){
        if(day.todos && day.todos[p[2]]) day.todos[p[2]] = day.todos[p[2]].filter(function(x){ return x.id !== p[3]; });
      } else if(p[0] === "e"){
        if(day.extraRoutines) day.extraRoutines = day.extraRoutines.filter(function(x){ return x.id !== p[2]; });
      }
    });
    selAnchor = null; save(); render();
  }

  function applyHours(val, label){
    var hs = hourSelList(), d = state.selectedDate;
    if(!hs.length) return;
    snapDays([d], hs.length + "칸 " + label, "hour");
    hs.forEach(function(h){ setHourly(d, h, val); });
    render();
  }
  function doHourCopy(){
    var hs = hourSelList(), d = state.selectedDate;
    if(!hs.length) return;
    hourClip = hs.map(function(h){ return getHourly(d, h); });
    render();
  }
  function doHourPaste(){
    var hs = hourSelList(), d = state.selectedDate;
    if(!hs.length || !hourClip || !hourClip.length) return;
    snapDays([d], "붙여넣기", "hour");
    if(hourClip.length === 1){
      hs.forEach(function(h){ setHourly(d, h, hourClip[0]); });
    } else {
      var start = SLOTS.indexOf(hs[0]);
      for(var i = 0; i < hourClip.length && start + i < SLOTS.length; i++){
        var hh = SLOTS[start + i];
        setHourly(d, hh, hourClip[i]);
        sel["h|" + d + "|" + hh] = true;
      }
    }
    render();
  }

  app.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    switch(t.getAttribute("data-action")){
      case "sel-mode":
        selMode = !selMode;
        if(!selMode){ selList(false).forEach(function(id){ delete sel[id]; }); selAnchor = null; }
        render();
        break;
      case "sel-delete": doSelDelete(); break;
      case "sel-clear": selList(false).forEach(function(id){ delete sel[id]; }); selAnchor = null; paintSel(); break;
      case "sel-all":
        app.querySelectorAll("[data-sel]").forEach(function(el){ var id = el.getAttribute("data-sel"); if(!selIsHour(id)) sel[id] = true; });
        paintSel();
        break;
      case "undo": undoLast(); break;
      case "hour-open": openHourPicker(t.closest(".hour-slot")); break;
      case "hour-copy": doHourCopy(); break;
      case "hour-paste": doHourPaste(); break;
      case "hour-clear": applyHours("", "지움"); break;
      case "hour-sel-all":
        app.querySelectorAll("[data-sel]").forEach(function(el){ var id = el.getAttribute("data-sel"); if(selIsHour(id)) sel[id] = true; });
        paintSel();
        break;
      case "hour-sel-clear": selList(true).forEach(function(id){ delete sel[id]; }); paintSel(); break;
    }
  });

  app.addEventListener("change", function(e){
    var t = e.target;
    if(t.classList && t.classList.contains("hour-select")) t.blur(); // 고른 뒤에는 포커스를 풀어 Ctrl+C/V가 바로 되게 해요
    if(t.getAttribute && t.getAttribute("data-action") === "hour-apply" && t.value){
      applyHours(t.value === "__clear" ? "" : t.value, t.value === "__clear" ? "지움" : "활동 적용");
    }
  });

  app.addEventListener("mousedown", function(e){
    if(e.button !== 0) return;
    var lab = e.target.closest("[data-selrow]");
    if(lab && selMode){
      e.preventDefault();
      var pr = lab.getAttribute("data-selrow").split("|");
      var cells = [].slice.call(app.querySelectorAll('[data-selcat="' + pr[0] + '"][data-selwk="' + pr[1] + '"]'));
      var all = cells.every(function(c){ return sel[c.getAttribute("data-sel")]; });
      cells.forEach(function(c){ var id = c.getAttribute("data-sel"); if(all) delete sel[id]; else sel[id] = true; });
      paintSel();
      return;
    }
    var it = e.target.closest("[data-sel]");
    if(!it) return;
    var id = it.getAttribute("data-sel"), hour = selIsHour(id);
    if(hour){
      if(e.target.closest(".hour-open") || e.target.closest(".hour-slot.editing select")) return;
      if(e.detail >= 2) { e.preventDefault(); return; } // 더블클릭의 두 번째 클릭은 선택을 바꾸지 않아요
    }
    else if(!selMode) return;
    e.preventDefault();
    var ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) ae.blur();
    var base = Object.assign({}, sel);
    // 시간표는 엑셀처럼: 그냥 클릭하면 그 칸만 선택, Ctrl(터치 화면은 그냥 클릭)이면 하나씩 추가/해제
    var additive = !hour || e.ctrlKey || e.metaKey || (window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
    if(hour && !additive) selList(true).forEach(function(k){ delete base[k]; });
    if(e.shiftKey && selAnchor && selIsHour(selAnchor) === hour){
      sel = Object.assign({}, base);
      addRect(selAnchor, id);
    } else if(hour && !additive){
      var only = selList(true).length === 1 && sel[id];
      sel = Object.assign({}, base);
      if(!only) sel[id] = true;
      selAnchor = id;
    } else {
      if(sel[id]) delete sel[id]; else sel[id] = true;
      selAnchor = id;
    }
    dragSel = {start:id, base:base, hour:hour, moved:false};
    paintSel();
  });
  app.addEventListener("mouseover", function(e){
    if(!dragSel) return;
    var it = e.target.closest("[data-sel]");
    if(!it) return;
    var id = it.getAttribute("data-sel");
    if(selIsHour(id) !== dragSel.hour) return;
    if(id === dragSel.start && !dragSel.moved) return;
    dragSel.moved = true;
    sel = Object.assign({}, dragSel.base);
    addRect(dragSel.start, id);
    paintSel();
  });
  document.addEventListener("mouseup", function(){ dragSel = null; });

  /* BTC 차트: 기간 버튼, 마우스/터치로 가리킨 날짜의 값 보기 */
  app.addEventListener("click", function(e){
    var b = e.target.closest('[data-action="btc-range"]');
    if(!b) return;
    btcRange = Number(b.getAttribute("data-days")) || 365;
    try{ localStorage.setItem("mover-btc-range", String(btcRange)); }catch(err){}
    refreshBtc();
  });
  function hideChartTips(){
    btcChartHover = false;
    app.querySelectorAll(".btc-chart.hover").forEach(function(w){ w.classList.remove("hover"); });
  }
  app.addEventListener("pointermove", function(e){
    var w = e.target.closest && e.target.closest(".btc-chart");
    if(!w){ if(btcChartHover) hideChartTips(); return; }
    var c = btcCharts[w.getAttribute("data-chart")], plot = w.querySelector(".chart-plot");
    if(!c || !plot) return;
    var r = plot.getBoundingClientRect();
    var fx = Math.min(1, Math.max(0, (e.clientX - r.left) / (r.width || 1)));
    var i = Math.round(fx * (c.n - 1)), pct = i / (c.n - 1) * 100;
    var tip = plot.querySelector(".ch-tip"), cross = plot.querySelector(".ch-cross");
    var d = c.dates[i], html = '<b>' + escapeHtml(d === "지금" ? "지금 (실시간 반영)" : d) + '</b>';
    c.series.forEach(function(s){
      var v = s.v[i];
      html += '<span>' + (c.series.length > 1 ? escapeHtml(s.name) + ' ' : '') + (v == null ? "—" : escapeHtml(c.fmt(v))) + '</span>';
    });
    tip.innerHTML = html;
    cross.style.left = pct + "%";
    tip.style.left = pct + "%";
    tip.classList.toggle("left", pct > 60);
    w.classList.add("hover");
    btcChartHover = true;
  });
  app.addEventListener("pointerleave", hideChartTips);

  function openHourPicker(row){
    if(!row) return;
    var s = row.querySelector("select");
    if(!s) return;
    row.classList.add("editing");
    s.focus();
    if(s.showPicker){ try{ s.showPicker(); }catch(err){} }
  }
  app.addEventListener("dblclick", function(e){
    var row = e.target.closest(".hour-slot");
    if(row && !e.target.closest(".hour-open")) openHourPicker(row);
  });
  app.addEventListener("focusout", function(e){
    var row = e.target.closest && e.target.closest(".hour-slot.editing");
    if(row) row.classList.remove("editing");
  });

  document.addEventListener("keydown", function(e){
    var tg = e.target;
    if(tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
    if(state.view !== "day" && state.view !== "month") return;
    var mod = e.ctrlKey || e.metaKey, key = e.key, hs = hourSelList();
    if(key === "Escape"){ sel = {}; selAnchor = null; paintSel(); }
    else if(mod && (key === "c" || key === "C") && hs.length){ e.preventDefault(); doHourCopy(); }
    else if(mod && (key === "v" || key === "V") && hs.length && hourClip){ e.preventDefault(); doHourPaste(); }
    else if(mod && (key === "a" || key === "A") && selMode){
      e.preventDefault();
      app.querySelectorAll("[data-sel]").forEach(function(el){ var id = el.getAttribute("data-sel"); if(!selIsHour(id)) sel[id] = true; });
      paintSel();
    }
    else if(key === "Delete" || key === "Backspace"){
      if(selMode && selList(false).length){ e.preventDefault(); doSelDelete(); }
      else if(hs.length){ e.preventDefault(); applyHours("", "지움"); }
    }
  });

  /* ---------------- 화면 캡쳐: 지금 보고 있는 카테고리 전체를 PNG 한 장으로 저장 ----------------
     브라우저가 그린 화면을 그대로 이미지로 만드는 html-to-image(오픈소스)를 처음 누를 때만 불러온다.
     이메일이 보이는 하단 동기화 문구, 설정·로그아웃 버튼, 선택 도구줄, 툴팁은 이미지에서 뺀다. */
  var SHOT_LIB = {
    src:"https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js",
    integrity:"sha384-YAj4cGTKsNinHUzylwDJDDZEpC6gnqNubmrp9eerckq7+gwWjABe5s2plXl3uUKb"
  };
  var shotBusy = false;
  var SHOT_LABELS = {month:"월간", day:"일간", stats:"통계", buy:"암호화폐", quote:"오늘의명언", apt:"아파트", redev:"재개발"};

  function loadShotLib(){
    if(window.htmlToImage) return Promise.resolve(window.htmlToImage);
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = SHOT_LIB.src; s.integrity = SHOT_LIB.integrity; s.crossOrigin = "anonymous";
      s.onload = function(){ window.htmlToImage ? resolve(window.htmlToImage) : reject(new Error("캡쳐 도구를 준비하지 못했어요.")); };
      s.onerror = function(){ reject(new Error("캡쳐 도구를 불러오지 못했어요. 인터넷 연결을 확인해주세요.")); };
      document.head.appendChild(s);
    });
  }
  function shotFilter(node){
    // 선택칸은 고른 항목만 보이므로, 나머지 항목은 이미지에 필요 없다 (시간표만 해도 수백 개라 이걸 빼면 몇 배 빨라진다)
    if(node.tagName === "OPTION") return !!node.selected;
    if(node.tagName === "OPTGROUP") return !!node.querySelector("option:checked");
    var c = node.classList;
    if(!c) return true;
    return !(c.contains("toolbar-actions") || c.contains("note") || c.contains("sel-bar") || c.contains("ch-tip") || c.contains("toast") || c.contains("hour-open"));
  }
  function shotName(){
    var d = new Date(), p2 = function(n){ return n < 10 ? "0" + n : "" + n; };
    var label = SHOT_LABELS[state.view] || "화면";
    if(state.view === "day") label += "_" + state.selectedDate;
    else if(state.view === "month" || state.view === "stats") label += "_" + state.year + "-" + p2(state.month + 1);
    return "무버_" + label + "_" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes()) + ".png";
  }
  function setShotBusy(on){
    shotBusy = on;
    var b = document.getElementById("shot-btn");
    if(b){ b.disabled = on; b.textContent = on ? "캡쳐 중..." : "📷 화면 캡쳐"; }
  }

  function takeShot(){
    if(shotBusy) return;
    setShotBusy(true);
    // 입력 칸에 커서가 있으면 깜빡이는 표시가 찍히니 풀어준다
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var root = getComputedStyle(document.documentElement);
    var bg = (root.getPropertyValue("--bg") || "").trim() || getComputedStyle(document.body).backgroundColor || "#ffffff";
    var nodes = [document.getElementById("app")];
    if(state.view === "redev" && rdvFrame && rdvFrame.contentDocument && rdvFrame.contentDocument.documentElement) nodes.push(rdvFrame.contentDocument.documentElement);
    // 화면은 .app이 가운데 정렬(margin:0 auto)이라 넓은 창일수록 왼쪽 여백이 크다. 이 여백까지 복제하면 내용이 밀려 오른쪽이 잘리므로,
    // 찍을 때는 여백을 0으로 둔다. 가로 크기는 넘쳐 나온 내용까지 포함해서 잡는다.
    var sizeOf = function(n){ return {w:Math.ceil(Math.max(n.scrollWidth, n.offsetWidth)), h:Math.ceil(Math.max(n.scrollHeight, n.offsetHeight))}; };
    var wMax = 0, hSum = 0;
    nodes.forEach(function(n){ var z = sizeOf(n); wMax = Math.max(wMax, z.w); hSum += z.h; });
    var ratio = Math.max(1, Math.min(2, 15000 / Math.max(wMax, hSum)));
    // 웹폰트 내장(skipFonts 끔)은 매번 8초가 걸리는데 실제로는 아무 폰트도 담지 못해서(시험 결과 0KB) 켜지 않는다. 글꼴은 기기의 한글 글꼴로 대신 그려진다.
    var run = function(lib){
      return Promise.all(nodes.map(function(n){
        var z = sizeOf(n);
        return lib.toCanvas(n, {backgroundColor:bg, pixelRatio:ratio, width:z.w, height:z.h, style:{margin:"0", maxWidth:"none"}, filter:shotFilter, skipFonts:true});
      }));
    };
    var wait = new Promise(function(r){ setTimeout(r, 60); }); // 버튼 문구가 바뀐 뒤 그리도록 한 박자 쉰다
    return Promise.all([loadShotLib(), wait]).then(function(r){
      return run(r[0]);
    }).then(function(canvases){
      var out = canvases[0];
      if(canvases.length > 1){
        out = document.createElement("canvas");
        out.width = Math.max.apply(null, canvases.map(function(c){ return c.width; }));
        out.height = canvases.reduce(function(s, c){ return s + c.height; }, 0);
        var ctx = out.getContext("2d");
        ctx.fillStyle = bg; ctx.fillRect(0, 0, out.width, out.height);
        var y = 0;
        canvases.forEach(function(c){ ctx.drawImage(c, 0, y); y += c.height; });
      }
      return new Promise(function(resolve, reject){
        out.toBlob(function(b){ b ? resolve(b) : reject(new Error("이미지를 만들지 못했어요. 화면이 너무 길 수 있어요.")); }, "image/png");
      });
    }).then(function(blob){
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = shotName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
      var msg = "화면을 이미지로 저장했어요: " + a.download;
      // 가능하면 클립보드에도 복사해서 바로 붙여넣을 수 있게 한다
      if(navigator.clipboard && window.ClipboardItem){
        return navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(function(){ showToast(msg + " (클립보드에도 복사됨)"); }, function(){ showToast(msg); });
      }
      showToast(msg);
    }).catch(function(e){
      showToast("캡쳐하지 못했어요: " + ((e && e.message) || e));
    }).then(function(){ setShotBusy(false); });
  }
  document.getElementById("shot-btn").addEventListener("click", takeShot);

  boot();
})();
</script>
