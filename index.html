<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>무버</title><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3F3EF;
    --surface:#FFFFFF;
    --surface-2:#EBEAE3;
    --border:#DEDCD3;
    --border-soft:#E8E7E0;
    --ink:#23262B;
    --ink-muted:#6B6E73;
    --ink-faint:#9B9E9C;
    --accent:#3F4C82;
    --accent-ink:#FFFFFF;
    --accent-soft:#E9EAF3;
    --success:#3F8F5F;
    --danger:#B0503F;
    --warning:#B07C2E;
    --shadow: 0 1px 2px rgba(30,30,20,0.04), 0 8px 24px -12px rgba(30,30,20,0.18);

    --cat-1:#5B7290;
    --cat-2:#B15A67;
    --cat-3:#5E8A66;
    --cat-4:#C08A3E;
    --cat-5:#7A6AA6;
    --cat-6:#2F5D6B;

    --tc-1:#B15A78;
    --tc-2:#5E8A66;
    --tc-3:#C99A3E;
    --tc-4:#5B7290;
    --tc-5:#7A6AA6;
    --tc-6:#83879A;
    --tc-none:#B9B7AE;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161A;
      --surface:#1C1F26;
      --surface-2:#242830;
      --border:#31353E;
      --border-soft:#282C34;
      --ink:#E8E6E1;
      --ink-muted:#9BA0AB;
      --ink-faint:#6E7280;
      --accent:#8B9AE8;
      --accent-ink:#12141A;
      --accent-soft:#242B45;
      --success:#5FBE85;
      --danger:#E08672;
      --warning:#D9A44E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161A;
    --surface:#1C1F26;
    --surface-2:#242830;
    --border:#31353E;
    --border-soft:#282C34;
    --ink:#E8E6E1;
    --ink-muted:#9BA0AB;
    --ink-faint:#6E7280;
    --accent:#8B9AE8;
    --accent-ink:#12141A;
    --accent-soft:#242B45;
    --success:#5FBE85;
    --danger:#E08672;
    --warning:#D9A44E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',serif;font-weight:700;text-wrap:balance;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;color:inherit;}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;border-radius:3px;
  }

  /* ---- top nav ---- */
  .tabs-wide{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--surface-2);padding:5px;border-radius:13px;border:1px solid var(--border-soft);margin-bottom:16px;box-shadow:var(--shadow);}
  .tabs-sub{display:flex;gap:6px;margin:-4px 0 16px;flex-wrap:wrap;}
  .tab-sub-btn{border:1px solid var(--border);background:var(--surface);padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-muted);font-family:inherit;}
  .tab-sub-btn:hover{color:var(--ink);}
  .tab-sub-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .empty-page{text-align:center;color:var(--ink-faint);padding:56px 16px;font-size:14px;}
  .tab-wide-btn{border:none;background:transparent;padding:13px 14px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink-muted);font-family:'Gowun Batang',serif;letter-spacing:0.02em;}
  .tab-wide-btn:hover{color:var(--ink);}
  .tab-wide-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);}

  .toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .nav-btn{border:1px solid var(--border);background:var(--surface);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink);}
  .nav-btn:hover{background:var(--surface-2);}
  .month-label{font-family:'Gowun Batang',serif;font-size:17px;min-width:108px;text-align:center;}
  .today-btn{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--accent);}
  .today-btn:hover{background:var(--accent-soft);}

  .icon-btn{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .icon-btn:hover{color:var(--ink);background:var(--surface-2);}

  /* ---- settings panel ---- */
  .settings{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow);}
  .settings[hidden]{display:none;}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  @media (max-width:720px){.settings-grid{grid-template-columns:1fr;}}
  .settings h3{font-size:13px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.06em;font-family:'Noto Sans KR';margin-bottom:10px;}
  .setting-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .setting-row input[type="text"]{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:13px;}
  .swatch{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);padding:0;background:none;flex-shrink:0;}
  .del-btn{border:none;background:transparent;color:var(--ink-faint);font-size:16px;width:22px;height:22px;border-radius:6px;flex-shrink:0;}
  .del-btn:hover{color:var(--danger);background:var(--surface-2);}
  .add-row-btn{border:1px dashed var(--border);background:transparent;color:var(--ink-muted);font-size:12.5px;padding:6px 10px;border-radius:6px;margin-top:2px;}
  .add-row-btn:hover{color:var(--accent);border-color:var(--accent);}
  .settings-grid .full-span{grid-column:1/-1;margin-top:6px;padding-top:16px;border-top:1px solid var(--border-soft);}
  .tc-block{border:1px solid var(--border-soft);border-radius:8px;padding:10px 10px 8px;margin-bottom:10px;background:var(--bg);}
  .tc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .tc-head input[type="text"]{font-weight:600;}
  .activity-row{display:flex;align-items:center;gap:8px;margin:0 0 6px 30px;}
  .activity-row input[type="text"]{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:12.5px;}
  .activity-add{margin-left:30px;}

  /* ---- monthly calendar ---- */
  .month-summary{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .month-summary-label{font-size:12.5px;font-weight:600;color:var(--ink-muted);white-space:nowrap;}
  .month-summary-pct{font-size:17px;font-weight:600;color:var(--accent);white-space:nowrap;}
  .month-summary-track{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
  .month-summary-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .2s;}
  .month-summary-count{font-size:12px;color:var(--ink-muted);white-space:nowrap;}
  @media (max-width:560px){ .month-summary{flex-wrap:wrap;} .month-summary-track{order:3;flex-basis:100%;} }

  .weekday-row{display:grid;grid-template-columns:96px repeat(7,minmax(0,1fr));gap:1px;margin-bottom:6px;}
  .weekday-row .wd{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.06em;padding-bottom:2px;}
  .weekday-row .wd:first-child{visibility:hidden;}
  .wd.sun{color:var(--danger);}
  .wd.sat{color:var(--accent);}

  .week-block{
    display:grid;grid-template-columns:96px repeat(7,minmax(0,1fr));
    background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    margin-bottom:12px;box-shadow:var(--shadow);
  }
  .cal-row{display:contents;}
  .cal-cell{border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:5px 7px;min-height:32px;position:relative;}
  .cal-row:last-child .cal-cell{border-bottom:none;}
  .week-block .cal-row:first-child .cal-cell{border-bottom:1px solid var(--border);}
  .cal-cell:nth-child(8){border-right:none;}

  .date-cell{background:var(--surface-2);display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;}
  .date-cell:hover{background:var(--accent-soft);}
  .date-cell .num{font-family:'IBM Plex Mono';font-weight:600;font-size:14px;}
  .date-cell.other-month{opacity:0.42;}
  .date-cell.is-today .num{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px;}
  .date-cell.sun .num{color:var(--danger);}
  .date-cell.sat .num{color:var(--accent);}
  .date-cell.holiday .num{color:var(--danger);}
  .date-cell.is-today.sun .num,.date-cell.is-today.sat .num,.date-cell.is-today.holiday .num{color:var(--accent-ink);}
  .holiday-dot{width:5px;height:5px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .date-cell.is-today .holiday-dot{background:var(--accent-ink);}
  .progress-dot{font-size:9.5px;color:var(--ink-faint);margin-left:auto;font-family:'IBM Plex Mono';}

  .row-label-cell{display:flex;align-items:center;font-size:12px;font-weight:600;padding:5px 10px;color:var(--ink);}
  .cal-cell.goal-cell{padding:2px 4px;}
  .goal-input{width:100%;border:none;background:transparent;font-size:12.5px;padding:4px 5px;border-radius:4px;color:var(--ink);}
  .goal-input::placeholder{color:var(--ink-faint);}
  .goal-input:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent);}

  /* ---- daily view ---- */
  .day-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .day-title-wrap{display:flex;align-items:center;gap:12px;}
  .day-title{font-size:22px;}
  .day-sub{font-size:12.5px;color:var(--ink-muted);}
  .holiday-label{color:var(--danger);font-weight:600;}
  .day-nav{display:flex;gap:8px;}

  .day-grid{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:18px;align-items:start;}
  @media (max-width:900px){.day-grid{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;}
  .card h2{font-size:15px;margin-bottom:12px;}
  .card h2 .count{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-muted);font-weight:400;margin-left:6px;}

  .month-rate{font-size:12px;color:var(--ink-muted);margin:-6px 0 14px;}
  .month-rate strong{color:var(--accent);font-weight:600;}
  .month-rate-sub{margin-left:4px;}

  .goal-check-row{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);}
  .goal-check-row:last-child{border-bottom:none;}
  .goal-cat-label{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .goal-text-input{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:7px 9px;font-size:13px;width:100%;}
  .achieve-check{width:19px;height:19px;accent-color:var(--success);justify-self:center;cursor:pointer;}

  .todo-groups{display:flex;flex-direction:column;gap:14px;}
  .todo-group-title{font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
  .todo-item{display:flex;align-items:center;gap:8px;padding:4px 0;}
  .todo-item input[type="checkbox"]{width:16px;height:16px;accent-color:var(--success);flex-shrink:0;}
  .todo-item input[type="text"]{flex:1;border:none;background:transparent;font-size:13px;padding:3px 2px;border-bottom:1px solid transparent;}
  .todo-item input[type="text"]:focus{border-bottom:1px solid var(--accent);}
  .todo-item.done input[type="text"]{color:var(--ink-faint);text-decoration:line-through;}
  .todo-item .del-btn{opacity:0;}
  .todo-item:hover .del-btn{opacity:1;}
  .todo-add{display:flex;gap:8px;margin-top:4px;}
  .todo-add input{flex:1;border:1px dashed var(--border);background:transparent;border-radius:6px;padding:6px 9px;font-size:12.5px;}
  .todo-add button{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-muted);}
  .todo-add button:hover{color:var(--accent);border-color:var(--accent);}

  .routine-item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--border-soft);}
  .routine-item:last-of-type{border-bottom:none;}
  .routine-item input[type="checkbox"]{width:17px;height:17px;accent-color:var(--success);flex-shrink:0;}
  .routine-item .rt-label{flex:1;font-size:13px;}
  .routine-item.done .rt-label{color:var(--ink-faint);text-decoration:line-through;}
  .routine-item input[type="text"]{flex:1;border:none;background:transparent;font-size:13px;padding:2px;}
  .routine-item .del-btn{opacity:0;flex-shrink:0;}
  .routine-item:hover .del-btn{opacity:1;}

  .summary-input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13.5px;resize:vertical;min-height:56px;font-family:'Noto Sans KR';}

  .hour-table{display:flex;flex-direction:column;position:sticky;top:16px;}
  .hour-row{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:2px 0;}
  .hour-slot{display:grid;grid-template-columns:38px minmax(0,1fr) 24px;gap:5px;align-items:center;padding:2px 3px;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;}
  /* 칸을 클릭하면 선택만 되고, 활동은 더블클릭이나 ▾ 버튼으로 골라요 */
  .hour-slot .hour-select{pointer-events:none;}
  .hour-slot.editing .hour-select{pointer-events:auto;}
  .hour-open{border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);border-radius:6px;height:28px;font-size:11px;cursor:pointer;padding:0;}
  .hour-open:hover{color:var(--accent);border-color:var(--accent);}
  /* 칸 선택 · 지우기 · 시간표 복사/붙여넣기 */
  .sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;}
  .sel-bar .icon-btn:disabled,.sel-bar select:disabled{opacity:.45;cursor:default;}
  .sel-mode-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .sel-mode-btn.on:hover{background:var(--accent);color:var(--accent-ink);}
  .icon-btn.danger{color:var(--danger);}
  .sel-count{font-size:12.5px;color:var(--ink-muted);min-width:64px;}
  .sel-hint{flex-basis:100%;font-size:11.5px;color:var(--ink-faint);line-height:1.5;}
  .hour-bar{margin:0 0 8px;}
  .hour-apply{max-width:100%;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 8px;font-size:12.5px;}
  .sel-on .sel-item{cursor:pointer;user-select:none;-webkit-user-select:none;}
  .sel-on .sel-item input,.sel-on .sel-item button,.sel-on .sel-item select,.sel-on .sel-item textarea{pointer-events:none;}
  .sel-on .row-label-cell{cursor:pointer;}
  .sel-item.selected{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft) !important;}
  .hour-label{cursor:pointer;user-select:none;-webkit-user-select:none;}
  .hour-slot.selected{background:var(--accent-soft);outline:none;}
  .hour-slot.selected .hour-label{color:var(--accent);font-weight:700;}
  .hour-label{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-muted);text-align:right;}
  .hour-select{
    border:1px solid var(--border);border-left:4px solid var(--tc-none);background:var(--bg);color:var(--ink);
    border-radius:6px;padding:5px 6px;font-size:12px;width:100%;min-width:0;text-overflow:ellipsis;transition:border-color .15s;
    appearance:none;-webkit-appearance:none;background-image:none;
  }

  .empty-hint{font-size:12px;color:var(--ink-faint);padding:6px 0;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);}
  .legend span{font-size:10.5px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* ---- stats ---- */
  .stats-list{display:flex;flex-direction:column;gap:16px;}
  .stats-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
  .stats-name{font-size:13.5px;font-weight:600;}
  .stats-hours{font-size:13px;color:var(--ink-muted);}
  .stats-track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
  .stats-fill{height:100%;border-radius:5px;transition:width .2s;}
  .stats-detail{margin-top:6px;font-size:12px;color:var(--ink-muted);}
  .stats-detail summary{cursor:pointer;color:var(--ink-muted);}
  .stats-detail summary:hover{color:var(--ink);}
  .stats-activity-line{display:flex;justify-content:space-between;padding:4px 0 4px 4px;border-bottom:1px solid var(--border-soft);}

  /* ---- buy criteria ---- */
  .buy-intro{font-size:12.5px;color:var(--ink-muted);line-height:1.6;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .buy-intro strong{color:var(--ink);font-weight:600;}
  .buy-card{padding:0;overflow:hidden;}
  .buy-verdict{padding:12px 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;background:var(--surface-2);border-bottom:1px solid var(--border-soft);}
  .buy-verdict-label{font-weight:700;font-size:13.5px;}
  .buy-verdict-detail{font-size:12px;color:var(--ink-muted);}
  .buy-verdict-good .buy-verdict-label{color:var(--success);}
  .buy-verdict-wait .buy-verdict-label{color:var(--warning);}
  .buy-verdict-warn .buy-verdict-label{color:var(--warning);}
  .buy-verdict-hard .buy-verdict-label{color:var(--danger);}
  .buy-verdict-pending .buy-verdict-label{color:var(--ink-muted);}
  .buy-head{display:flex;align-items:center;gap:8px;padding:14px 18px 4px;}
  .buy-name-input{flex:1;border:none;background:transparent;font-family:'Gowun Batang',serif;font-size:18px;font-weight:700;color:var(--ink);padding:2px 0;}
  .buy-section{padding:14px 18px;border-top:1px solid var(--border-soft);}
  .buy-section-title{font-size:12.5px;font-weight:600;color:var(--ink-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .buy-field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .buy-field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-muted);}
  .buy-field input{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--ink);width:100%;}
  .buy-result{margin-top:10px;font-size:12.5px;color:var(--ink-muted);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .buy-result strong{font-size:15px;color:var(--ink);}
  .buy-gap{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--surface-2);}
  .buy-gap.good{color:var(--success);}
  .buy-gap.wait{color:var(--warning);}

  function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,9); }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
  function keyOf(date){ return dateKey(date.getFullYear(), date.getMonth(), date.getDate()); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function cloneTimeCategories(){ return JSON.parse(JSON.stringify(DEFAULT_TIME_CATEGORIES)); }

  function defaultState(){
    var now = new Date();
    return {
      view: "month",
      year: now.getFullYear(),
      month: now.getMonth(),
      selectedDate: keyOf(now),

  // 한 번만 실행: 저장된 시간표 분류의 "투자"에 "암호화폐" 활동을 추가한다 (이미 있으면 그대로, 이후에 지워도 되살리지 않는다).
  function migrateCryptoActivity(parsed){
    var m = parsed.migrations;
    if(m.tcCrypto1) return;
    m.tcCrypto1 = true;
    migratedNow = true;
    var invest = parsed.timeCategories.find(function(c){ return c.id === "tc-invest"; });
    if(!invest) return;
    invest.activities = invest.activities || [];
    if(!invest.activities.some(function(a){ return a.name === "암호화폐"; })) invest.activities.push({id:"act-crypto", name:"암호화폐"});
  }

  // 한 번만 실행: 시간표가 30분 단위가 되면서, 예전에 1시간 단위로 기록한 칸은 :00과 :30 두 칸에 같은 활동으로 채운다.
  // (그래야 이전 기록의 통계 시간이 그대로 유지된다. :30 칸이 이미 채워져 있으면 건드리지 않는다.)
  function migrateHalfHours(parsed){
    var m = parsed.migrations;
    if(m.split30) return;
    m.split30 = true;
    migratedNow = true;
    Object.keys(parsed.days).forEach(function(k){
      var hourly = parsed.days[k] && parsed.days[k].hourly;
      if(!hourly) return;
      Object.keys(hourly).forEach(function(h){
        if(h.indexOf(".") >= 0 || !hourly[h]) return;
        if(!hourly[h + ".5"]) hourly[h + ".5"] = hourly[h];
      });
    });
  }

  // 한 번만 실행되는 데이터 이전. 이미 저장된 시간표 분류에도 "계획/기록"을 투자로 옮기고 "부동산"을 추가한다.
  // 활동 id는 그대로 두므로 이전에 기록한 시간표·통계는 유지된다. 표시는 사용자가 이후에 지우거나 옮겨도 다시 되돌리지 않는다.
  var migratedNow = false;
  function migrateTimeCategories(parsed){
    var m = parsed.migrations = (parsed.migrations && typeof parsed.migrations === "object") ? parsed.migrations : {};
    if(m.tcInvest1) return;
    m.tcInvest1 = true;
    migratedNow = true;
    var invest = parsed.timeCategories.find(function(c){ return c.id === "tc-invest"; });
    if(!invest) return;
    invest.activities = invest.activities || [];
    var moved = null;
    parsed.timeCategories.forEach(function(c){
      if(c === invest) return;
      c.activities = (c.activities || []).filter(function(a){
        if(a.id === "act-plan"){ moved = a; return false; }
        return true;
      });
    });
    if(moved && !invest.activities.some(function(a){ return a.id === "act-plan"; })) invest.activities.push(moved);
    if(!invest.activities.some(function(a){ return a.name === "부동산"; })) invest.activities.push({id:"act-realestate", name:"부동산"});
  }

  /* 재개발 비교평가표(redevelopment.html)가 보내오는 데이터. 계정 동기화 대상에 포함된다. */
  function normalizeRedev(r){
    var out = {cands:{}, stress:{sp:15, delay:2}};
    if(r && typeof r === "object"){
      if(r.cands && typeof r.cands === "object" && !Array.isArray(r.cands)) out.cands = r.cands;
      if(r.stress && typeof r.stress === "object"){
        if(r.stress.sp !== undefined && r.stress.sp !== null) out.stress.sp = r.stress.sp;
        if(r.stress.delay !== undefined && r.stress.delay !== null) out.stress.delay = r.stress.delay;
      }
    }
    return out;
  }

  function sanitizeState(parsed){
    var def = defaultState();
    parsed.categories = parsed.categories && parsed.categories.length ? parsed.categories : def.categories;
    // "투자 매수기준" 카테고리는 폐지. 이미 저장된 데이터(브라우저·클라우드)에서도 목록에서 뺀다.
    var kept = parsed.categories.filter(function(c){ return c.id !== "cat-buycriteria"; });
    parsed.categories = kept.length ? kept : def.categories;
    parsed.templates = parsed.templates || def.templates;
    parsed.timeCategories = parsed.timeCategories && parsed.timeCategories.length ? parsed.timeCategories : def.timeCategories;
    parsed.buyChecklists = parsed.buyChecklists || [];
    parsed.btc = normalizeBtc(parsed.btc);
    parsed.redev = normalizeRedev(parsed.redev);
    migrateTimeCategories(parsed);
    parsed.days = parsed.days || {};
    migrateHalfHours(parsed);
    migrateCryptoActivity(parsed);
    if(!parsed.selectedDate) parsed.selectedDate = def.selectedDate;
    if(typeof parsed.year !== "number") parsed.year = def.year;
    if(typeof parsed.month !== "number") parsed.month = def.month;
    if(["month","day","stats","buy","quote","apt","redev"].indexOf(parsed.view) < 0) parsed.view = "month";
    return parsed;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      return sanitizeState(JSON.parse(raw));
    }catch(e){ return defaultState(); }
  }

  var state = defaultState();

  /* ---------------- 로그인 · 클라우드 동기화 (Supabase) ---------------- */
  // SB_URL / SB_KEY 가 비어 있으면 로그인 없이 이 브라우저에만 저장됩니다.
  // 공개용(anon/publishable) 키만 넣으세요. 데이터는 DB의 행 단위 보안(RLS)으로 본인만 읽고 쓸 수 있어요.
  var SESSION_KEY = "mover-sb-session";
  var session = null;
  var cloudReady = false, cloudVersion = null, lastPushedJson = "";
  var pushTimer = null, pushing = false, pushAgain = false, pollStarted = false;
  var cloudStatus = "local"; // local | saving | synced | offline
  var UI_FIELDS = ["view","year","month","selectedDate","settingsOpen"];

  function sbConfigured(){ return !!(SB_URL && SB_KEY); }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    if(cloudReady) schedulePush();
  }

  function dataPart(){
    return {categories:state.categories, templates:state.templates, timeCategories:state.timeCategories, buyChecklists:state.buyChecklists, btc:state.btc, redev:state.redev, migrations:state.migrations, days:state.days};
  }

  function setCloudStatus(s){
    cloudStatus = s;
    var el = document.querySelector(".cloud-status");
    if(el) el.outerHTML = renderCloudStatus();
  }

  function renderCloudStatus(){
    var label = {
      local: "이 브라우저에만 저장됨",
      saving: "☁ 저장 중...",
      synced: "☁ " + (session ? session.user.email : "") + " 계정에 동기화됨 — 로그인하면 어느 기기에서나 이어서 볼 수 있어요",
      offline: "⚠ 오프라인이에요 — 연결되면 자동으로 다시 동기화돼요"
    }[cloudStatus] || "";
    return '<span class="cloud-status">' + escapeHtml(label) + '</span>';
  }

  function showToast(msg){
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 9000);
  }

  function sbAuth(path, body, token){
    var headers = {"apikey":SB_KEY, "Content-Type":"application/json"};
    if(token) headers["Authorization"] = "Bearer " + token;
    return fetch(SB_URL + "/auth/v1/" + path, {method:"POST", headers:headers, body:JSON.stringify(body||{})})
      .then(function(r){
        return r.text().then(function(t){
          var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
          if(!r.ok) throw new Error((j && (j.msg || j.error_description || j.message || j.error)) || ("HTTP " + r.status));
          return j;
        });
      });
  }

  function toSession(j){
    return {
      access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at:j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600)),
      user:{id:j.user.id, email:j.user.email}
    };
  }
  function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){ return null; } }
  function writeSession(s){
    session = s;
    try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){}
  }

  function ensureFreshSession(){
    if(!session) return Promise.reject(new Error("no session"));
    if(session.expires_at - 60 > Date.now()/1000) return Promise.resolve(session);
    // 동시에 여러 요청이 새로고침하면 일회용 토큰이 충돌해 로그인이 풀리니, 진행 중인 갱신을 공유해요.
    if(!refreshing){
      refreshing = sbAuth("token?grant_type=refresh_token", {refresh_token:session.refresh_token}).then(function(j){
        writeSession(toSession(j));
        refreshing = null;
        return session;
      }, function(err){ refreshing = null; throw err; });
    }
    return refreshing;
  }
  var refreshing = null;

  function sbRest(method, query, body, prefer){
    return ensureFreshSession().then(function(s){
      var headers = {"apikey":SB_KEY, "Authorization":"Bearer " + s.access_token, "Content-Type":"application/json"};
      if(prefer) headers["Prefer"] = prefer;
      return fetch(SB_URL + "/rest/v1/user_state" + query, {method:method, headers:headers, body: body ? JSON.stringify(body) : undefined});
    }).then(function(r){
      if(r.status === 401){ var ae = new Error("auth"); ae.auth = true; throw ae; }
      return r.text().then(function(t){
        var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
        if(!r.ok){ var e2 = new Error((j && j.message) || ("HTTP " + r.status)); e2.status = r.status; throw e2; }
        return j;
      });
    });
  }

  function myRow(select){ return "?select=" + select + "&user_id=eq." + encodeURIComponent(session.user.id); }

  function adoptRemote(data){
    var merged = Object.assign({}, data);
    UI_FIELDS.forEach(function(k){ merged[k] = state[k]; });
    migratedNow = false;
    state = sanitizeState(merged);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    // 서버 데이터에 이전(마이그레이션)이 새로 적용됐다면 빈 값으로 두어 바로 서버에도 저장되게 한다.
    lastPushedJson = migratedNow ? "" : JSON.stringify(dataPart());
    migratedNow = false;
    sendRdv();
  }

  function initialSync(){
    return sbRest("GET", myRow("data,version")).then(function(rows){
      if(rows && rows.length){
        cloudVersion = rows[0].version;
        adoptRemote(rows[0].data);
      } else {
        cloudVersion = null;
      }
      cloudReady = true;
      if(!(rows && rows.length)) doPush();
      else if(!lastPushedJson) schedulePush();
    });
  }

  function schedulePush(){
    if(JSON.stringify(dataPart()) === lastPushedJson) return;
    setCloudStatus("saving");
    clearTimeout(pushTimer);
    pushTimer = setTimeout(doPush, 700);
  }

  function doPush(){
    pushTimer = null;
    if(pushing){ pushAgain = true; return; }
    var json = JSON.stringify(dataPart());
    if(json === lastPushedJson){ setCloudStatus("synced"); return; }
    pushing = true;
    var payload = JSON.parse(json);
    var req = (cloudVersion === null)
      ? sbRest("POST", "", {user_id:session.user.id, data:payload, version:1}, "return=representation")
      : sbRest("PATCH", "?user_id=eq." + encodeURIComponent(session.user.id) + "&version=eq." + cloudVersion,
               {data:payload, version:cloudVersion + 1, updated_at:new Date().toISOString()}, "return=representation");
    req.then(function(rows){
      if(rows && rows.length){
        cloudVersion = rows[0].version;
        lastPushedJson = json;
        setCloudStatus("synced");
      } else {
        return handleConflict();
      }
    }).catch(function(e){
      if(e.auth){ forceLogout("로그인이 만료됐어요. 다시 로그인해주세요."); return; }
      if(e.status === 409 && cloudVersion === null){ return handleConflict(); }
      setCloudStatus("offline");
    }).then(function(){
      pushing = false;
      if(pushAgain){ pushAgain = false; doPush(); }
    });
  }

  function handleConflict(){
    return sbRest("GET", myRow("data,version")).then(function(rows){
      if(rows && rows.length){
        cloudVersion = rows[0].version;
        adoptRemote(rows[0].data);
        render();
        showToast("다른 기기에서 먼저 수정되어 최신 내용으로 불러왔어요. 방금 입력한 내용이 사라졌다면 다시 입력해주세요.");
      }
      setCloudStatus("synced");
    });
  }

  function pollCloud(){
    if(!session) return;
    if(!cloudReady){
      initialSync().then(function(){ render(); setCloudStatus("synced"); }).catch(function(){});
      return;
    }
    if(pushing || pushTimer) return;
    if(JSON.stringify(dataPart()) !== lastPushedJson){ doPush(); return; }
    var a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    sbRest("GET", myRow("version")).then(function(rows){
      if(rows && rows.length && rows[0].version > cloudVersion){
        return sbRest("GET", myRow("data,version")).then(function(full){
          if(full && full.length){ cloudVersion = full[0].version; adoptRemote(full[0].data); render(); setCloudStatus("synced"); }
        });
      }
      if(cloudStatus === "offline") setCloudStatus("synced");
    }).catch(function(e){
      if(e.auth) forceLogout("로그인이 만료됐어요. 다시 로그인해주세요.");
      else setCloudStatus("offline");
    });
  }

  function startPolling(){
    if(pollStarted) return;
    pollStarted = true;
    setInterval(pollCloud, 30000);
    document.addEventListener("visibilitychange", function(){ if(document.hidden) flushPush(); else pollCloud(); });
    window.addEventListener("pagehide", flushPush);
  }

  // 수정 직후 탭을 닫거나 다른 탭으로 가도 대기 중인 저장을 바로 보내요.
  function flushPush(){
    if(!cloudReady || !pushTimer) return;
    clearTimeout(pushTimer);
    doPush();
  }

  function renderLoading(msg){
    showRdvHost(false);
    setShotVisible(false);
    document.getElementById("app").innerHTML = '<div class="login-wrap"><div class="login-card"><h1 class="login-title">무버</h1><p class="login-sub">' + escapeHtml(msg) + '</p></div></div>';
  }

  function renderLogin(msg, email, mode, ok){
    showRdvHost(false);
    setShotVisible(false);
    document.getElementById("app").innerHTML =
      '<div class="login-wrap"><form class="login-card" data-action="login-form">' +
      '<h1 class="login-title">무버</h1>' +
      '<p class="login-sub">로그인하면 어느 기기에서나 내 루틴과 매수기준이 이어져요.</p>' +
      '<label class="login-field"><span>이메일</span><input type="email" name="email" autocomplete="username" required value="' + escapeHtml(email || "") + '"></label>' +
      '<label class="login-field"><span>비밀번호</span><input type="password" name="password" autocomplete="current-password" required></label>' +
      '<div class="login-msg' + (ok ? ' ok' : '') + '" role="alert">' + escapeHtml(msg || "") + '</div>' +
      '<button type="submit" class="login-btn">로그인</button>' +
      '</form></div>';
  }

  function friendlyAuthError(err){
    var m = String((err && err.message) || err);
    if(/invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";
    if(/email not confirmed/i.test(m)) return "이메일 인증이 아직이에요. 가입할 때 받은 메일의 링크를 먼저 눌러주세요.";
    if(/rate limit|too many/i.test(m)) return "요청이 너무 잦아요. 잠시 뒤에 다시 시도해주세요.";
    if(/password should be|weak password/i.test(m)) return "비밀번호가 너무 쉬워요. 더 길고 복잡하게 만들어주세요.";
    if(/invalid.*email|email.*invalid|unable to validate email/i.test(m)) return "이메일 형식을 확인해주세요.";
    if(err instanceof TypeError || /failed to fetch|networkerror/i.test(m)) return "인터넷 연결을 확인해주세요.";
    return m;
  }

  function startSession(){
    STORAGE_KEY = STORAGE_BASE + ":" + session.user.id;
    state = loadState();
    cloudReady = false; cloudVersion = null; lastPushedJson = "";
    renderLoading("불러오는 중...");
    initialSync().then(function(){
      render();
      setCloudStatus("synced");
    }).catch(function(e){
      if(e.auth){ forceLogout("로그인이 만료됐어요. 다시 로그인해주세요."); return; }
      renderSyncFail();
    });

  function consumeAuthHash(){
    var h = location.hash.replace(/^#/, "");
    if(!h || (h.indexOf("access_token=") < 0 && h.indexOf("error") < 0)) return Promise.resolve(null);
    var p = new URLSearchParams(h);
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    if(p.get("error") || p.get("error_description")){
      return Promise.reject(new Error("인증 링크가 만료됐거나 이미 사용됐어요. 로그인해주세요."));
    }
    var at = p.get("access_token"), rt = p.get("refresh_token");
    if(!at || !rt) return Promise.resolve(null);
    return fetch(SB_URL + "/auth/v1/user", {headers:{"apikey":SB_KEY, "Authorization":"Bearer " + at}})
      .then(function(r){ return r.json(); })
      .then(function(u){
        if(!u || !u.id) throw new Error("인증 정보를 확인하지 못했어요. 다시 로그인해주세요.");
        return {
          access_token:at, refresh_token:rt,
          expires_at:Number(p.get("expires_at")) || (Math.floor(Date.now()/1000) + Number(p.get("expires_in") || 3600)),
          user:{id:u.id, email:u.email}
        };
      });
  }

  function computeMonthStats(year, month){
    var totals = {}, activityTotals = {};
    var prefix = year + "-" + pad(month+1) + "-";
    Object.keys(state.days).forEach(function(key){
      if(key.indexOf(prefix) !== 0) return;
      var hourly = state.days[key].hourly;

      Object.keys(hourly).forEach(function(h){

  function getWeeksOfMonth(year, month){
    var first = new Date(year, month, 1);
    var last = new Date(year, month+1, 0);
    var start = new Date(first); start.setDate(first.getDate() - first.getDay());
    var end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
    var weeks = [];
    var cursor = new Date(start);
    while(cursor <= end){
      var week = [];
      for(var i=0;i<7;i++){
        week.push(new Date(cursor));
        cursor.setDate(cursor.getDate()+1);
      }
      weeks.push(week);
    }
    return weeks;
  }

  function cmGet(metrics, startDate, attempt){

  /* 펀딩비: 최근 7일(8시간 간격 21회) 평균을 연환산 %로. Bybit 우선, 실패하면 OKX. 둘 다 키 불필요한 공개 API.
     차트용으로 일별 평균의 7일 이동평균 이력도 함께 만든다 (지표 값과 같은 정의). */
  function annualizedFunding(rates){
    rates = rates.filter(function(x){ return isFinite(x); });
    if(rates.length < 15) return null;
    return rates.reduce(function(a, b){ return a + b; }, 0) / rates.length * 3 * 365 * 100;
  }
  function buildFunding(rates){ // rates: [{t:ms, r:8시간 요율}] 최신순
    rates = rates.filter(function(x){ return isFinite(x.r) && isFinite(x.t); });
    var value = annualizedFunding(rates.slice(0, 21).map(function(x){ return x.r; }));
    if(value == null) return null;
    var byDay = {};
    rates.forEach(function(x){ var k = new Date(x.t).toISOString().slice(0, 10); (byDay[k] = byDay[k] || []).push(x.r); });
    var days = Object.keys(byDay).sort().slice(1); // 첫날은 일부 시각만 있을 수 있어 뺀다
    var daily = days.map(function(k){ return {d:k, v:byDay[k].reduce(function(a, b){ return a + b; }, 0) / byDay[k].length * 3 * 365 * 100}; });
    var series = [];
    daily.forEach(function(x, i){
      if(i < 6) return;
      var s = 0; for(var j = i - 6; j <= i; j++) s += daily[j].v;
      series.push({d:x.d, v:s / 7});
    });
    return {value:value, series:series};
  }

        return fetch("https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=100")
          .then(function(r){ return r.json(); })
          .then(function(j){ return buildFunding(j.data.map(function(x){ return {t:Number(x.fundingTime), r:Number(x.fundingRate)}; })); })
          .catch(function(){ return null; });
      });
  }

  /* 차트용 일별 이력 (최근 4년). 모든 배열이 날짜 배열 d와 같은 길이이고 없는 날은 null.
     wma = 200주(1400일) 평균선, wma200 = 가격/평균선, dd = 역대 고점 대비 %, puell = 발행수익/365일 평균 */
  var BTC_HIST_DAYS = 1461;
  function buildBtcHist(rows, prices, on, fngS, fundS){
    var n = prices.length, N = Math.min(BTC_HIST_DAYS, n), s = n - N;
    var pre = [0], runMax = [], mx = 0;
    prices.forEach(function(p, i){ pre.push(pre[i] + p); mx = Math.max(mx, p); runMax.push(mx); });
    var mvrvBy = {}, issD = [], issV = [], issIdx = {};
    on.forEach(function(r){
      var d = r.time.slice(0, 10);
      if(r.CapMVRVCur != null) mvrvBy[d] = Number(r.CapMVRVCur);
      if(r.IssTotUSD != null){ issIdx[d] = issV.length; issD.push(d); issV.push(Number(r.IssTotUSD)); }
    });
    var issPre = [0];
    issV.forEach(function(v, i){ issPre.push(issPre[i] + v); });
    var fundBy = {};
    if(fundS) fundS.series.forEach(function(x){ fundBy[x.d] = x.v; });
    var h = {d:[], price:[], wma:[], wma200:[], dd:[], mvrv:[], puell:[], fng:[], fund7:[]};
    var r3 = function(x){ return x == null ? null : Math.round(x * 1000) / 1000; };
    for(var i = s; i < n; i++){
      var d = rows[i].time.slice(0, 10), mean = i >= 1399 ? (pre[i + 1] - pre[i - 1399]) / 1400 : null;
      var ix = issIdx[d], pu = (ix != null && ix >= 364) ? issV[ix] / ((issPre[ix + 1] - issPre[ix - 364]) / 365) : null;
      h.d.push(d);
      h.price.push(Math.round(prices[i]));
      h.wma.push(mean == null ? null : Math.round(mean));
      h.wma200.push(mean == null ? null : r3(prices[i] / mean));
      h.dd.push(r3((prices[i] / runMax[i] - 1) * 100));
      h.mvrv.push(mvrvBy[d] != null ? r3(mvrvBy[d]) : null);
      h.puell.push(r3(pu));
      h.fng.push(fngS && fngS.byDate[d] != null ? fngS.byDate[d] : null);
      h.fund7.push(fundBy[d] != null ? r3(fundBy[d]) : null);
    }
    return h;
  }

  function fetchBtcData(){
    if(btcFetching) return;
    btcFetching = true; btcError = ""; btcLastAttempt = Date.now();
    fetchBtcLive(true);
    refreshBtc();
    var pPrice = cmGet("PriceUSD", "2010-07-18");
    var pOn = cmGet("CapMVRVCur,IssTotUSD", isoDaysAgo(BTC_HIST_DAYS + 380));
    var pFng = fetchFngSeries();
    var pFund = fetchFunding();
    btcQuickAt = Date.now();
    Promise.all([pPrice, pOn, pFng, pFund]).then(function(res){
      var rows = res[0].filter(function(r){ return r.PriceUSD != null; });
      if(rows.length < 1400) throw new Error("가격 이력이 부족해요.");
      var prices = rows.map(function(r){ return Number(r.PriceUSD); });
      var last = prices[prices.length - 1];
      var ath = Math.max.apply(null, prices);
      var w = prices.slice(-1400);
      var wma = w.reduce(function(a, b){ return a + b; }, 0) / w.length;
      var on = res[1], mvrv = null;
      for(var i = on.length - 1; i >= 0; i--){ if(on[i].CapMVRVCur != null){ mvrv = Number(on[i].CapMVRVCur); break; } }
      var iss = on.filter(function(r){ return r.IssTotUSD != null; }).map(function(r){ return Number(r.IssTotUSD); });
      var i365 = iss.slice(-365);
      var puell = i365.length >= 300 ? iss[iss.length - 1] / (i365.reduce(function(a, b){ return a + b; }, 0) / i365.length) : null;
      var fngS = res[2], fundS = res[3];
      btcAuto = {
        values:{mvrv:mvrv, wma200:last / wma, puell:puell, fng:fngS ? fngS.latest : null, dd:(last / ath - 1) * 100, fund:fundS ? fundS.value : null},
        price:last, ath:ath, p7:prices[prices.length - 8], p30:prices[prices.length - 31], priceAsOf:rows[rows.length - 1].time.slice(0, 10), fetchedAt:Date.now(),
        hist:buildBtcHist(rows, prices, on, fngS, fundS)
      };
      try{ localStorage.setItem(BTC_CACHE_KEY, JSON.stringify(btcAuto)); }catch(e){}
    }).catch(function(e){
      if(e instanceof TypeError){
        btcError = (navigator.onLine === false)
          ? "인터넷 연결을 확인해주세요."
          : "지표 데이터 서버(Coin Metrics)가 일시적으로 응답하지 않아요. 잠시 후 '↻ 지표 새로고침'을 눌러보세요." + (btcAuto ? " 지금은 이전에 받아둔 지표를 보여줘요." : "");
      } else {
        btcError = (e.message || "지표를 불러오지 못했어요.") + (btcAuto ? " 지금은 이전에 받아둔 지표를 보여줘요." : "");
      }
    }).then(function(){
      btcFetching = false;
      refreshBtc();
    });
  }

  /* ---- 즉시 최신화 ----
     - 현재가: Coinbase 웹소켓으로 체결될 때마다 실시간 수신 (연결이 안 되면 10~15초마다 조회로 대신한다)
     - 공포·탐욕 지수, 펀딩비: 5분마다
     - 일봉 지표(MVRV·200주선·퓨얼·고점): 30분마다, 그리고 새 일봉이 나올 시간(UTC 날짜가 바뀐 뒤)에는 더 자주
     암호화폐 탭을 보고 있고 화면이 켜져 있을 때만 동작하고, 다른 탭으로 가거나 화면이 숨겨지면 멈춘다. */
  var BTC_FULL_MS = 30*60*1000, BTC_QUICK_MS = 5*60*1000;
  var btcWs = null, btcWsOpen = false, btcWsRetry = 0, btcWsTimer = null, btcPaintTimer = null, btcQuickAt = 0;

  function btcWatching(){
    return state.view === "buy" && !document.hidden && (!sbConfigured() || !!session);
  }
  function scheduleBtcPaint(){
    if(btcPaintTimer) return;
    btcPaintTimer = setTimeout(function(){ btcPaintTimer = null; if(state.view === "buy") refreshBtc(true); }, 1000);
  }
  function startBtcWs(){
    if(btcWs || !window.WebSocket || !btcWatching()) return;
    var ws;
    try{ ws = new WebSocket("wss://ws-feed.exchange.coinbase.com"); }catch(e){ return; }
    btcWs = ws;
    ws.onopen = function(){
      btcWsRetry = 0; btcWsOpen = true;
      ws.send(JSON.stringify({type:"subscribe", product_ids:["BTC-USD"], channels:["ticker"]}));
      scheduleBtcPaint();
    };
    ws.onmessage = function(e){
      var m; try{ m = JSON.parse(e.data); }catch(err){ return; }
      if(m.type !== "ticker") return;
      var p = Number(m.price);
      if(!(p > 0)) return;
      btcLive = {price:p, at:Date.now()};
      scheduleBtcPaint();
    };
    ws.onclose = function(){
      if(btcWs !== ws) return; // 우리가 직접 닫은 경우
      btcWs = null; btcWsOpen = false;
      scheduleBtcPaint();
      if(btcWatching()) btcWsTimer = setTimeout(startBtcWs, Math.min(30000, 2000 * Math.pow(2, btcWsRetry++)));
    };
    ws.onerror = function(){ try{ ws.close(); }catch(e){} };
  }
  function stopBtcWs(){
    clearTimeout(btcWsTimer);
    btcWsOpen = false;
    if(btcWs){ var w = btcWs; btcWs = null; try{ w.close(); }catch(e){} }
  }

  function fetchBtcQuick(){
    if(btcQuickAt && Date.now() - btcQuickAt < 30000) return;
    btcQuickAt = Date.now();
    Promise.all([fetchFng(), fetchFunding()]).then(function(r){
      if(!btcAuto || !btcAuto.values) return;
      if(r[0] != null) btcAuto.values.fng = r[0];
      if(r[1] != null) btcAuto.values.fund = r[1].value;
      try{ localStorage.setItem(BTC_CACHE_KEY, JSON.stringify(btcAuto)); }catch(e){}
      refreshBtc(true);
    });
  }

  // 새 일봉이 나와야 할 시점이면(지표 기준일이 어제보다 오래됨) 30분을 기다리지 않고 10분마다 다시 확인한다.
  function btcFullDue(){
    if(!btcAuto) return true;
    var age = Date.now() - btcAuto.fetchedAt;
    if(age >= BTC_FULL_MS) return true;
    var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    return (btcAuto.priceAsOf || "") < yesterday && age >= 10*60*1000;
  }

  function ensureBtcData(){
    if(!btcWatching()){ stopBtcWs(); return; }
    startBtcWs();
    if(!btcWsOpen) fetchBtcLive(false);
    if(btcFetching) return;
    if(btcFullDue()){
      if(Date.now() - btcLastAttempt < 60000) return;
      fetchBtcData();
    } else if(Date.now() - btcQuickAt >= BTC_QUICK_MS){
      fetchBtcQuick();
    }
  }

  setInterval(ensureBtcData, 15000);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stopBtcWs(); else if(state.view === "buy") ensureBtcData();
  });
  window.addEventListener("online", function(){ if(state.view === "buy") ensureBtcData(); });

  /* ---- 지표 해석과 최종 판정 ---- */
  /* 일봉 마감값에 실시간 현재가를 반영한 자동 지표값.
     - 200주 이동평균 비율, 고점 대비 하락률: 가격만으로 계산되므로 현재가로 정확히 재계산
     - MVRV, Puell: 온체인 일봉 지표라 실시간 값이 없어 현재가/마감가 비율로 보정한 추정치
       (실현시가총액·채굴 발행량은 하루 안에 거의 변하지 않으므로 오차가 작다)
     - 공포탐욕지수: 이미 당일 값이라 그대로 */
  var BTC_LIVE_ADJUSTED = {mvrv:1, puell:1, wma200:1, dd:1};
  function btcAutoValue(key){
    var a = btcAuto;
    if(!a || !a.values) return null;
    var v = a.values[key];
    if(v == null || !btcLive || !(a.price > 0) || !BTC_LIVE_ADJUSTED[key]) return v;
    var k = btcLive.price / a.price;
    if(key === "dd") return (btcLive.price / Math.max(a.ath, btcLive.price) - 1) * 100;
    return v * k;
  }
  function btcSrcLabel(key, src){
    if(src === "manual") return "직접 입력";
    if(src !== "auto") return "";
    if(!btcLive || !BTC_LIVE_ADJUSTED[key]) return "자동";
    return (key === "mvrv" || key === "puell") ? "자동 · 현재가 보정(추정)" : "자동 · 현재가 반영";
  }
  function btcValue(key){
    var m = state.btc.manual[key];
    if(m !== "" && m != null && isFinite(parseFloat(m))) return {v:parseFloat(m), src:"manual"};
    var a = btcAutoValue(key);
    if(a != null && isFinite(a)) return {v:a, src:"auto"};
    return null;
  }
  function btcZone(ind, v){ return v <= ind.low ? "good" : (v >= ind.high ? "hot" : "mid"); }

  function computeBtc(){
    var b = state.btc, counts = {good:0, mid:0, hot:0}, known = 0, rows = [];
    BTC_INDICATORS.forEach(function(ind){
      var e = btcValue(ind.key), zone = null;
      if(e){ zone = btcZone(ind, e.v); counts[zone]++; known++; }
      rows.push({ind:ind, e:e, zone:zone});
    });
    var disc = BTC_DISCIPLINE.filter(function(x){ return b.discipline[x.id]; }).length;
    return {rows:rows, counts:counts, known:known, disc:disc, discTotal:BTC_DISCIPLINE.length, rating:computeBtcRating(b, counts, known, disc)};
  }

  // 5단계: 1=분할 매수 적극 고려 ... 5=회피. 멍거의 순서를 따라 "무엇을 모르는지·무엇을 잃을 수 있는지"를 가격보다 먼저 봅니다.
  function computeBtcRating(b, c, known, disc){
    var total = BTC_DISCIPLINE.length;
    if(b.tooHard) return {level:5, label:"회피", desc:"이해하기 어렵다고 판단해 너무 어려운 상자에 넣었어요. 이해되지 않는 것은 사지 않는 게 멍거의 첫 원칙이에요."};
    if(known >= 3 && c.hot >= 3) return {level:5, label:"회피 · 과열 구간", desc:"과열 신호가 " + c.hot + "개예요. 모두가 열광할 때는 새로 사지 않고 기다리는 게 규율이에요."};
    if(b.q1Answer !== true) return {level:4, label:"보완 필요", desc:"능력범위부터 확인하세요. ②에서 비트코인이 10년 뒤에도 쓰일 명확한 이유를 적고 \"예\"를 눌러야 해요."};
    if(disc < total) return {level:4, label:"보완 필요", desc:"규율 체크가 " + disc + "/" + total + "개예요. 가격보다 먼저, 잃지 않는 조건부터 갖추세요."};
    if(known < 3) return {level:4, label:"지표 부족", desc:"지표가 3개 이상 필요해요. 지표 새로고침을 누르거나 직접 입력해주세요."};
    if(c.good >= 4) return {level:1, label:"분할 매수 적극 고려", desc:"저평가 신호가 " + c.good + "개 겹쳤어요 (멍거가 말한 여러 요인의 겹침). 한 번에 몰아서 사지 말고, 정해둔 한도 안에서 나눠서 접근하세요."};
    if(c.good >= 3) return {level:2, label:"분할 매수 후보", desc:"저평가 신호가 " + c.good + "개예요. 한도 안에서 소액씩 나눠 사는 정도를 고려할 수 있어요."};
    return {level:3, label:"관찰 · 대기", desc:"저평가 신호가 " + c.good + "개뿐이에요 (과열 " + c.hot + "개). 확실한 기회가 올 때까지 기다리는 구간이에요."};
  }

  }

  var rdvFrame = null, rdvReady = false;
  var rdvOrigin = (location.origin === "null") ? "*" : location.origin;
  function showRdvHost(show){
    var host = document.getElementById("rdv-host");
    var appEl = document.getElementById("app");
    if(!host) return;
    host.hidden = !show;
    appEl.style.paddingBottom = show ? "0" : "";
    if(show && !rdvFrame){
      rdvFrame = document.createElement("iframe");
      rdvFrame.title = "재개발 비교평가표";
      rdvFrame.src = "redevelopment.html";
      rdvFrame.style.cssText = "width:100%;height:900px;border:0;display:block;";
      host.appendChild(rdvFrame);
    }
  }
  function sendRdv(){
    if(!rdvFrame || !rdvReady || !rdvFrame.contentWindow) return;
    rdvFrame.contentWindow.postMessage({
      type:"rdv-init", cands:state.redev.cands, stress:state.redev.stress,
      synced: !!(sbConfigured() && session && cloudReady)
    }, rdvOrigin);
  }
  window.addEventListener("message", function(e){
    if(!rdvFrame || e.source !== rdvFrame.contentWindow) return;
    if(e.origin !== location.origin && location.origin !== "null") return;
    var d = e.data;
    if(!d || typeof d !== "object") return;
    if(d.type === "rdv-ready"){ rdvReady = true; sendRdv(); }
    else if(d.type === "rdv-save"){ state.redev = normalizeRedev({cands:d.cands, stress:d.stress}); save(); }
    else if(d.type === "rdv-height" && typeof d.h === "number" && d.h > 50){ rdvFrame.style.height = Math.ceil(d.h) + "px"; }
  });
  function groupOf(view){
    if(view === "month" || view === "day" || view === "stats") return "plan";
    if(view === "buy") return "crypto";
    if(view === "apt" || view === "redev") return "realestate";
    return "quote";
  }

  function cssVarToHex(v){
    if(v.indexOf("var(")===0){
      var name = v.slice(4,-1);
      var real = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return colorToHex(real) || "#888888";
    }
    return v;
  }
  function colorToHex(c){
    if(!c) return null;
    if(c[0]==="#") return c;
    var m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if(!m) return null;
    return "#" + [m[1],m[2],m[3]].map(function(x){ return (+x).toString(16).padStart(2,"0"); }).join("");
  }

  /* ---------------- render: stats ---------------- */

    goalHtml += '<h2>이번 달 목표 달성률<span class="count">' + overallPct + '% (' + goalStats.totalAchieved + '/' + goalStats.totalFilled + ')</span></h2>';
    if(goalStats.totalFilled === 0){
      goalHtml += '<div class="empty-hint">아직 이 달에 채운 목표가 없어요. 월간 화면이나 일간 화면에서 목표를 적어보세요.</div>';

      goalHtml += '<div class="stats-list">';
      state.categories.forEach(function(cat){
        var s = goalStats.byCat[cat.id] || {filled:0, achieved:0};
        var pct = s.filled ? Math.round(s.achieved/s.filled*100) : 0;
        goalHtml += '<div class="stats-row">';
        goalHtml += '  <div class="stats-row-top"><span class="stats-name" style="color:'+cat.color+';">'+escapeHtml(cat.name)+'</span><span class="stats-hours mono">'+pct+'% ('+s.achieved+'/'+s.filled+')</span></div>';
        goalHtml += '  <div class="stats-track"><div class="stats-fill" style="width:'+pct+'%;background:'+cat.color+';"></div></div>';
        goalHtml += '</div>';
      });
      goalHtml += '</div>';
    }
    goalHtml += '</div>';

    var stats = computeMonthStats(state.year, state.month);
    var rows = state.timeCategories.map(function(cat){
      return {cat:cat, hours: stats.totals[cat.id]||0, byAct: stats.activityTotals[cat.id]||{}};
    });
    var totalHours = rows.reduce(function(s,r){ return s+r.hours; }, 0);
    rows.sort(function(a,b){ return b.hours - a.hours; });
    var maxHours = rows.length ? Math.max.apply(null, rows.map(function(r){ return r.hours; })) : 0;

    var html = goalHtml;
    html += '<div class="card">';
    html += '<h2>이번 달 시간 투자 통계<span class="count">총 ' + fmtHours(totalHours) + '시간 기록</span></h2>';
    if(totalHours === 0){
      html += '<div class="empty-hint">아직 이 달에 기록된 시간 계획표가 없어요. 일간 화면에서 시간 계획표를 채워보면 여기에 카테고리별 통계가 쌓입니다.</div>';
    } else {
      html += '<div class="stats-list">';
      rows.forEach(function(r){
        var pct = maxHours>0 ? Math.round(r.hours/maxHours*100) : 0;
        var actEntries = Object.keys(r.byAct).map(function(aid){
          var found = findActivity(aid);
          return {name: found ? found.activity.name : aid, hours: r.byAct[aid]};
        }).sort(function(a,b){ return b.hours - a.hours; });

        html += '<div class="stats-row">';
        html += '  <div class="stats-row-top"><span class="stats-name" style="color:'+r.cat.color+';">'+escapeHtml(r.cat.name)+'</span><span class="stats-hours mono">'+fmtHours(r.hours)+'시간</span></div>';
        html += '  <div class="stats-track"><div class="stats-fill" style="width:'+pct+'%;background:'+r.cat.color+';"></div></div>';
        if(actEntries.length){
          html += '  <details class="stats-detail"><summary>세부 활동 ' + actEntries.length + '개</summary>';
          actEntries.forEach(function(a){
            html += '<div class="stats-activity-line"><span>'+escapeHtml(a.name)+'</span><span class="mono">'+fmtHours(a.hours)+'시간</span></div>';
          });
          html += '</details>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;

  /* ---------------- render: BTC buy criteria ---------------- */
  function fmtIndValue(ind, v){
    var s = v.toFixed(ind.dec);
    return ind.unit === "%" ? s + "%" : s + ind.unit;
  }
  function usd(n){ return "$" + Math.round(n).toLocaleString("en-US"); }

  function btcZoneBadge(zone){
    return '<span class="btc-zone zone-' + (zone || "none") + '">' + (zone ? ZONE_LABEL[zone] : "데이터 없음") + '</span>';
  }
  function btcSummaryText(d){
    return "저평가 " + d.counts.good + " · 중립 " + d.counts.mid + " · 과열 " + d.counts.hot + "  (지표 " + d.known + "/" + BTC_INDICATORS.length + ")";
  }

  /* ---------------- BTC 차트 (외부 라이브러리 없이 SVG) ----------------
     선은 SVG(가로세로 비율을 늘려 그림, 선 굵기는 고정), 글자·점·십자선·툴팁은 HTML로 얹어서 어떤 폭에서도 글자가 늘어나지 않게 한다. */
  var BTC_RANGES = [[183,"6개월"], [365,"1년"], [1095,"3년"], [1461,"4년"]];
  var btcRange = 365;
  try{
    var _savedRange = Number(localStorage.getItem("mover-btc-range"));
    if(BTC_RANGES.some(function(x){ return x[0] === _savedRange; })) btcRange = _savedRange;
  }catch(e){}
  var btcCharts = {}, btcChartPaintAt = 0, btcChartHover = false;

  // 현재 기간의 일별 이력. trim이면 앞쪽 빈 값을 잘라낸다 (펀딩비처럼 이력이 짧은 지표용)
  function histRange(key, trim){
    var h = btcAuto && btcAuto.hist;
    if(!h || !h[key]) return null;
    var s = Math.max(0, h.d.length - btcRange), d = h.d.slice(s), v = h[key].slice(s);
    if(trim){ var a = 0; while(a < v.length && v[a] == null) a++; d = d.slice(a); v = v.slice(a); }
    return {d:d, v:v};
  }
  function chartEmptyHtml(){
    return '<div class="chart-empty">' + (btcFetching ? "차트 데이터를 불러오는 중..." : "차트 데이터가 아직 없어요. 위의 지표 새로고침을 눌러보세요.") + '</div>';
  }

  // o: {id, title, log, low, high, fmt, zoneOf, marks:[{v,label}], yMin, yMax, step, area}
  function lineChart(dates, series, o){
    var n = dates.length;
    if(n < 2) return chartEmptyHtml();
    var tf = o.log ? Math.log : function(x){ return x; };
    var ok = function(x){ return x != null && isFinite(x) && (!o.log || x > 0); };
    var dLo = Infinity, dHi = -Infinity;
    series.forEach(function(s){ s.v.forEach(function(x){ if(ok(x)){ var t = tf(x); if(t < dLo) dLo = t; if(t > dHi) dHi = t; } }); });
    if(!isFinite(dLo)) return chartEmptyHtml();
    var lo = dLo, hi = dHi, span = (dHi - dLo) || 1;
    // 기준선이 데이터 범위에서 너무 멀면 축에 넣지 않는다 (그래프가 납작해지는 걸 막는다). 구간 색칠은 아래에서 잘라서 그린다.
    [o.low, o.high].forEach(function(x){
      if(x == null || (o.log && x <= 0)) return;
      var t = tf(x);
      if(t >= dLo - 0.6 * span && t <= dHi + 0.6 * span){ if(t < lo) lo = t; if(t > hi) hi = t; }
    });
    if(o.yMin != null) lo = tf(o.yMin);
    if(o.yMax != null) hi = tf(o.yMax);
    else { var pad = (hi - lo || 1) * 0.08; lo -= pad; hi += pad; }
    var Y = function(x){ return 100 - (tf(x) - lo) / (hi - lo) * 100; };
    var clampY = function(y){ return Math.max(0, Math.min(100, y)); };
    var X = function(i){ return i / (n - 1) * 1000; };
    var f2 = function(x){ return Math.round(x * 100) / 100; };

    var svg = '<svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">';
    if(o.low != null && ok(o.low)){ var yl = clampY(Y(o.low)); if(yl < 100) svg += '<rect class="zone-good" x="0" y="' + f2(yl) + '" width="1000" height="' + f2(100 - yl) + '"/>'; }
    if(o.high != null && ok(o.high)){ var yh = clampY(Y(o.high)); if(yh > 0) svg += '<rect class="zone-hot" x="0" y="0" width="1000" height="' + f2(yh) + '"/>'; }
    var lines = [];
    if(o.low != null && ok(o.low)){ var a1 = Y(o.low); if(a1 > 0 && a1 < 100) lines.push(a1); }
    if(o.high != null && ok(o.high)){ var a2 = Y(o.high); if(a2 > 0 && a2 < 100) lines.push(a2); }
    (o.marks || []).forEach(function(m){ var a3 = Y(m.v); if(a3 > 0 && a3 < 100) lines.push(a3); });
    lines.forEach(function(y){ svg += '<line class="ch-ref" x1="0" x2="1000" y1="' + f2(y) + '" y2="' + f2(y) + '"/>'; });

    var lastPt = null;
    series.forEach(function(s, si){
      var d = "", prevY = null, started = false, firstX = null, lastX = null;
      s.v.forEach(function(x, i){
        if(!ok(x)){ started = false; return; }
        var px = f2(X(i)), py = f2(Y(x));
        if(!started){ d += "M" + px + " " + py; started = true; if(firstX == null) firstX = px; }
        else if(o.step) d += "L" + px + " " + prevY + "L" + px + " " + py;
        else d += "L" + px + " " + py;
        prevY = py; lastX = px;
        if(si === 0) lastPt = {i:i, x:x, px:px, py:py};
      });
      if(o.area && si === 0 && firstX != null) svg += '<path class="ch-area" d="' + d + 'L' + lastX + ' 100L' + firstX + ' 100Z"/>';
      svg += '<path class="ch-line ' + s.cls + '" d="' + d + '"/>';
    });
    svg += '</svg>';

    var html = '<div class="chart-plot">' + svg;
    if(o.low != null && ok(o.low)){ var tl = Y(o.low); if(tl > 3 && tl < 97) html += '<span class="ch-th good" style="top:' + f2(tl) + '%">저평가 ' + o.fmt(o.low) + ' 이하</span>'; }
    if(o.high != null && ok(o.high)){ var th = Y(o.high); if(th > 3 && th < 97) html += '<span class="ch-th hot" style="top:' + f2(th) + '%">과열 ' + o.fmt(o.high) + ' 이상</span>'; }
    (o.marks || []).forEach(function(m){ var tm = Y(m.v); if(tm > 3 && tm < 97) html += '<span class="ch-th" style="top:' + f2(tm) + '%">' + escapeHtml(m.label) + '</span>'; });
    var all = []; series[0].v.forEach(function(x){ if(ok(x)) all.push(x); });
    var vMin = Math.min.apply(null, all), vMax = Math.max.apply(null, all);
    html += '<span class="ch-max">' + o.fmt(vMax) + '</span><span class="ch-min">' + o.fmt(vMin) + '</span>';
    if(lastPt){
      var zone = o.zoneOf ? o.zoneOf(lastPt.x) : "";
      html += '<i class="ch-dot ' + (zone ? 'zone-' + zone : '') + '" style="left:' + f2(lastPt.px / 10) + '%;top:' + f2(lastPt.py) + '%"></i>';
    }
    html += '<i class="ch-cross"></i><div class="ch-tip"></div></div>';
    html += '<div class="chart-x"><span>' + escapeHtml(dates[0]) + '</span><span>' + escapeHtml(dates[n - 1] === "지금" ? "지금" : dates[n - 1]) + '</span></div>';

    btcCharts[o.id] = {n:n, dates:dates, fmt:o.fmt, series:series.map(function(s){ return {name:s.name, v:s.v}; })};
    var aria = o.title + ": " + dates[0] + " " + o.fmt(all[0]) + " → " + dates[n - 1] + " " + o.fmt(all[all.length - 1]) + ", 최저 " + o.fmt(vMin) + ", 최고 " + o.fmt(vMax);
    return '<div class="btc-chart" data-chart="' + o.id + '" role="img" aria-label="' + escapeHtml(aria) + '">' + html + '</div>';
  }

  // 오늘(지금) 값을 이력 끝에 붙인다. 실시간 현재가가 반영된 자동 값이라 마지막 점이 헤더 숫자와 일치한다.
  function withNow(r, nowVal){
    var d = r.d.slice(), v = r.v.slice();
    if(nowVal != null && isFinite(nowVal)){ d.push("지금"); v.push(nowVal); }
    return {d:d, v:v};
  }

  function btcIndChartHtml(ind){
    var key = ind.key === "fund" ? "fund7" : ind.key;
    var r = histRange(key, ind.key === "fund");
    if(!r || r.d.length < 2) return chartEmptyHtml();
    var isLiveKey = ind.key !== "fng" && ind.key !== "fund";
    if(isLiveKey) r = withNow(r, btcAutoValue(ind.key));
    var html = lineChart(r.d, [{name:ind.label, cls:"s-main", v:r.v}], {id:"ind-" + ind.key, title:ind.label, low:ind.low, high:ind.high,
      fmt:function(v){ return fmtIndValue(ind, v); }, zoneOf:function(v){ return btcZone(ind, v); }});
    if(ind.key === "fund") html += '<div class="chart-note">Bybit가 주는 최근 약 2개월 (일별 평균의 7일 이동평균)</div>';
    return html;
  }

  function btcChartsTopHtml(){
    var h = '<div class="chart-top-head"><div class="buy-section-title">가격과 신호 추이</div><div class="chart-range" role="group" aria-label="차트 기간">';

    var p = histRange("price"), m = histRange("wma");
    h += '<div class="chart-panel"><div class="chart-head"><span class="chart-title">BTC 가격과 200주 평균선 <em>(로그 눈금)</em></span>' +
      '<span class="chart-legend"><i class="lg s-main"></i>가격 <i class="lg s-ma"></i>200주 평균</span></div>';
    if(p && m && p.d.length > 1){
      var pv = p.v.slice(), mv = m.v.slice(), d = p.d.slice();
      if(btcLive){ d.push("지금"); pv.push(btcLive.price); mv.push(mv[mv.length - 1]); }

    } else h += chartEmptyHtml();
    h += '</div>';

    // 2) 저평가 신호가 겹친 개수의 과거 추이 (장기 이력이 있는 5개 지표)
    var keys = ["mvrv", "wma200", "puell", "fng", "dd"], rs = {}, ready = !!(btcAuto && btcAuto.hist);
    keys.forEach(function(k){ rs[k] = histRange(k); if(!rs[k]) ready = false; });

          var x = rs[ind.key].v[i];
          if(x != null){ any = true; if(x <= ind.low) c++; }
        });
        return any ? c : null;

      var dts = rs.mvrv.d.slice(), nowC = 0, nowAny = false;
      BTC_INDICATORS.forEach(function(ind){

  function refreshBtc(light){
    var root = document.querySelector(".btc-card");
    if(!root) return;
    var d = computeBtc();
    var snap = root.querySelector(".btc-snap");
    if(light === true) paintBtcSnapLight(root);
    else if(snap) snap.innerHTML = btcSnapHtml();
    // 차트: 새 데이터·기간 변경 때는 바로, 실시간 틱 중에는 20초에 한 번만 (마우스를 올려 보고 있을 땐 건드리지 않는다)
    if(light === "input"){ /* 직접 입력·체크 중에는 차트를 다시 그리지 않는다 */ }
    else if(light !== true || (Date.now() - btcChartPaintAt > 20000 && !btcChartHover)) paintBtcCharts(root);
    d.rows.forEach(function(row){
      var el = root.querySelector('.btc-ind[data-key="' + row.ind.key + '"]');
      if(!el) return;
      var zEl = el.querySelector(".btc-zone"), zNew = btcZoneBadge(row.zone);
      if(zEl.outerHTML !== zNew) zEl.outerHTML = zNew;
      el.querySelector(".btc-val").textContent = row.e ? fmtIndValue(row.ind, row.e.v) : "—";
      el.querySelector(".btc-src").textContent = row.e ? btcSrcLabel(row.ind.key, row.e.src) : "";
      var autoV = btcAutoValue(row.ind.key);
      el.querySelector(".btc-manual").placeholder = (autoV != null && isFinite(autoV)) ? "자동 " + autoV.toFixed(row.ind.dec) : "값 입력";
    });
    var sum = root.querySelector(".btc-summary");
    if(sum) sum.textContent = btcSummaryText(d);
    var sc = root.querySelector(".btc-disc-score");
    if(sc) sc.textContent = d.disc + "/" + d.discTotal;
    var fin = root.querySelector(".buy-final"), finNew = renderFinalRating(d.rating);
    if(fin && fin.outerHTML.replace(/\s+/g, "") !== finNew.replace(/\s+/g, "")) fin.outerHTML = finNew;
  }

  /* ---------------- events ---------------- */
  var app = document.getElementById("app");

  app.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");

    switch(action){
      case "show-month": state.view="month"; save(); render(); break;
      case "show-day": state.view="day"; save(); render(); break;
      case "show-stats": state.view="stats"; save(); render(); break;
      case "show-buy": state.view="buy"; save(); render(); break;
      case "show-plan": state.view=lastPlanView; save(); render(); break;
      case "show-realestate": state.view=lastRealView; save(); render(); break;
      case "show-apt": state.view="apt"; save(); render(); break;
      case "show-redev": state.view="redev"; save(); render(); break;
      case "logout": logout(); break;
      case "show-quote": state.view="quote"; save(); render(); break;
      case "quote-prev": quoteOffset--; render(); break;
      case "quote-next": quoteOffset++; render(); break;
      case "quote-today": quoteOffset = 0; render(); break;
      case "quote-random": {
        var step = 1 + Math.floor(Math.random() * (QUOTES.length - 1));
        quoteOffset += step;
        render();
        break;
      }
      case "prev-month": changeMonth(-1); break;
      case "next-month": changeMonth(1); break;
      case "goto-today": {
        var now = new Date();
        state.year = now.getFullYear(); state.month = now.getMonth();
        state.selectedDate = keyOf(now); state.view = "day";
        save(); render();
        break;
      }
      case "toggle-settings": state.settingsOpen = !state.settingsOpen; save(); render(); break;
      case "open-day": {
        var dt = t.getAttribute("data-date");
        state.selectedDate = dt; state.view = "day";
        var p = dt.split("-").map(Number);
        state.year = p[0]; state.month = p[1]-1;
        save(); render();
        break;
      }
      case "prev-day": shiftDay(-1); break;
      case "next-day": shiftDay(1); break;

      case "cat-add": {
        var id = uid("cat");
        var palette = ["var(--cat-1)","var(--cat-2)","var(--cat-3)","var(--cat-4)","var(--cat-5)"];
        state.categories.push({id:id, name:"새 카테고리", color: palette[state.categories.length % palette.length]});
        save(); render();
        break;
      }
      case "cat-del": {
        var row = t.closest("[data-cat-id]");
        var cid = row.getAttribute("data-cat-id");
        state.categories = state.categories.filter(function(c){ return c.id!==cid; });
        save(); render();
        break;
      }
      case "tpl-add": {
        state.templates.push({id:uid("rt"), name:"새 루틴"});
        save(); render();
        break;
      }
      case "tpl-del": {
        var row2 = t.closest("[data-tpl-id]");
        var tid = row2.getAttribute("data-tpl-id");
        state.templates = state.templates.filter(function(x){ return x.id!==tid; });
        save(); render();
        break;
      }
      case "routine-tpl-del": {
        var tid3 = t.getAttribute("data-tpl");
        state.templates = state.templates.filter(function(x){ return x.id!==tid3; });
        save(); render();
        break;
      }

      case "tc-add": {
        var tcPalette = ["var(--tc-1)","var(--tc-2)","var(--tc-3)","var(--tc-4)","var(--tc-5)","var(--tc-6)"];
        state.timeCategories.push({id:uid("tc"), name:"새 카테고리", color: tcPalette[state.timeCategories.length % tcPalette.length], activities:[]});
        save(); render();
        break;
      }
      case "tc-del": {
        var tcRowDel = t.closest("[data-tc-id]");
        var tcidDel = tcRowDel.getAttribute("data-tc-id");
        state.timeCategories = state.timeCategories.filter(function(c){ return c.id!==tcidDel; });
        save(); render();
        break;
      }
      case "act-add": {
        var tcIdForAct = t.getAttribute("data-tc");
        var tcForAct = state.timeCategories.find(function(c){ return c.id===tcIdForAct; });
        if(tcForAct){ tcForAct.activities.push({id:uid("act"), name:"새 활동"}); save(); render(); }
        break;
      }
      case "act-del": {
        var tcIdForDel = t.getAttribute("data-tc"), actIdForDel = t.getAttribute("data-act");
        var tcForDel = state.timeCategories.find(function(c){ return c.id===tcIdForDel; });
        if(tcForDel){ tcForDel.activities = tcForDel.activities.filter(function(a){ return a.id!==actIdForDel; }); save(); render(); }
        break;
      }

      case "todo-add": addTodo(t.getAttribute("data-date"), t.getAttribute("data-group")); break;
      case "todo-del": {
        var dte = t.getAttribute("data-date"), grp = t.getAttribute("data-group"), id2 = t.getAttribute("data-id");
        var arr = getTodos(dte, grp).filter(function(x){ return x.id!==id2; });
        setTodos(dte, grp, arr); render();
        break;
      }
      case "extra-routine-add": addExtraRoutine(t.getAttribute("data-date")); break;
      case "extra-routine-del": {
        var dte2 = t.getAttribute("data-date"), id3 = t.getAttribute("data-id");
        var arr2 = getExtraRoutines(dte2).filter(function(x){ return x.id!==id3; });
        setExtraRoutines(dte2, arr2); render();
        break;
      }

      case "btc-refresh": fetchBtcData(); break;
      case "btc-q1": {
        var valQ1 = t.getAttribute("data-val");
        state.btc.q1Answer = (valQ1 === "yes") ? true : (valQ1 === "no" ? false : null);
        save();
        t.closest(".btc-card").querySelectorAll(".yesno-btn").forEach(function(b){ b.classList.remove("active-yes","active-no"); });
        if(state.btc.q1Answer === true) t.classList.add("active-yes");
        else if(state.btc.q1Answer === false) t.classList.add("active-no");
        refreshBtc("input");
        break;
      }
    }
  });

        break;
      }
      case "tpl-name": {
        var row3 = t.closest("[data-tpl-id]");
        var tid2 = row3.getAttribute("data-tpl-id");
        var tpl = state.templates.find(function(x){ return x.id===tid2; });

      }
      case "tc-name": {

  app.addEventListener("input", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");
    switch(action){
      case "goal-input": {
